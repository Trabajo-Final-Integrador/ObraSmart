<aside class="sidebar" [class.open]="menuAbierto$ | async" [ngClass]="sidebarConfig.customClass">
  <!-- Header del sidebar (opcional) -->
  <div class="sidebar-header" *ngIf="sidebarConfig.showHeader">
    <h3><i class="bi bi-grid-3x3-gap me-2"></i>{{ 'menu.main' | translate }}</h3>
    <button class="close-sidebar-btn" (click)="cerrarSidebar()">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <!-- Menu items dinámicos -->
  <ul class="nav flex-column sidebar-menu">
    <ng-container *ngFor="let item of filteredMenuItems">
      <li class="nav-item" *ngIf="item.visible !== false">

        <!-- Item CON submenu -->
        <ng-container *ngIf="hasSubmenu(item) && sidebarConfig.showSubmenus">
          <a
            class="nav-link d-flex justify-content-between align-items-center"
            href="#"
            (click)="toggleSubmenu(item.label, $event)"
          >
            <span class="d-flex align-items-center">
              <i class="bi {{ item.icon }} me-2"></i> {{ item.label | translate }}
            </span>
            <i class="bi bi-chevron-right toggle-icon"
               [class.open]="isSubmenuOpen(item.label)"></i>
          </a>

          <!-- Submenu -->
          <ul *ngIf="isSubmenuOpen(item.label)" class="submenu">
            <li *ngFor="let subitem of item.submenu">
              <a
                class="dropdown-item"
                [routerLink]="subitem.route"
                routerLinkActive="active"
                (click)="cerrarSidebar()"
              >
                <i class="bi {{ subitem.icon }} me-2"></i> {{ subitem.label | translate }}
              </a>
            </li>
          </ul>
        </ng-container>

        <!-- Item SIN submenu (enlace directo) -->
        <ng-container *ngIf="!hasSubmenu(item) || !sidebarConfig.showSubmenus">
          <a
            class="nav-link"
            [routerLink]="item.route"
            routerLinkActive="active"
            (click)="cerrarSidebar()"
          >
            <i class="bi {{ item.icon }} me-2"></i> {{ item.label | translate }}
          </a>
        </ng-container>

      </li>
    </ng-container>
  </ul>

  <!-- Footer del sidebar (opcional) -->
  <div class="sidebar-footer" *ngIf="sidebarConfig?.showFooter || showConfigButton">
    <div class="links">
      <button type="button" (click)="abrirModalTerminos()">Términos</button>
      <span class="separator">|</span>
      <button type="button" (click)="abrirModalPrivacidad()">Privacidad</button>
      <span class="separator">|</span>
      <button type="button" (click)="abrirModalSoporte()">Soporte</button>
      <ng-container *ngIf="showConfigButton">
        <span class="separator">|</span>
        <button
          type="button"
          class="config-link"
          (click)="onConfigToggle()"
          [attr.title]="'navbar.config' | translate"
          [attr.aria-label]="'navbar.config' | translate"
        >
          <i class="bi bi-gear"></i>
        </button>
      </ng-container>
    </div>
    <div class="sidebar-config-menu" *ngIf="showConfigButton && configMenuAbierto">
      <div class="config-section">
        <p class="config-title">{{ 'language.label' | translate }}</p>
        <div class="config-options">
          <button
            type="button"
            *ngFor="let lang of languageOptions"
            [class.active]="selectedLanguage === lang.id"
            (click)="seleccionarIdioma(lang.id)"
          >
            <span>✔</span>{{ lang.labelKey | translate }}
          </button>
        </div>
      </div>
      <div class="config-section">
        <p class="config-title">{{ 'navbar.theme' | translate }}</p>
        <div class="config-options">
          <button
            type="button"
            *ngFor="let theme of uiThemeOptions"
            [class.active]="selectedThemeId === theme.id"
            (click)="seleccionarTheme(theme.id)"
          >
            <span>✔</span>{{ theme.labelKey | translate }}
          </button>
        </div>
      </div>
    </div>
  </div>
</aside>

<!-- Overlay para cerrar sidebar en mobile -->
<div class="sidebar-overlay" [class.active]="menuAbierto$ | async" (click)="cerrarSidebar()"></div>
