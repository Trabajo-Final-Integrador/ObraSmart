<div class="layout-container">
  <!-- 🔹 NAVBAR SUPERIOR -->
  <header class="top-navbar">
    <div class="navbar-left">
      <button class="menu-btn" (click)="toggleSidebar()" [title]="'menu.main' | translate">
        <i class="bi bi-list"></i>
      </button>
      <div class="brand">
        <img src="assets/asistente/logo.png" alt="ObraSmart" class="logo-navbar" />
        <span class="navbar-title">{{ 'stock.movementForm.title' | translate }}</span>
      </div>
    </div>
    <div class="navbar-actions">
      <button class="btn-regresar" routerLink="/principal" [title]="'common.backHome' | translate">
        <i class="bi bi-house-door-fill"></i>
      </button>
      <button class="btn-back" routerLink="/stock/movimientos" [title]="'common.back' | translate">
        <i class="bi bi-arrow-left-circle"></i>
      </button>
    </div>
  </header>

  <app-sidebar [type]="'full'" [showConfigButton]="true"></app-sidebar>
  <app-modal-info></app-modal-info>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="content">
    <div class="form-container">
      <div class="form-card">
        <!-- HEADER -->

        <!-- FORMULARIO -->
        <div class="form-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">
                <i class="bi bi-box me-2"></i>{{ 'stock.movementForm.part' | translate }}
                <span class="text-danger">*</span>
              </label>
              <select class="form-select" [(ngModel)]="form.idRepuesto">
                <option value="" disabled selected>{{ 'stock.movementForm.selectPart' | translate }}</option>
                <option *ngFor="let rep of repuestos" [value]="rep.id">
                  {{ rep.codigo }} - {{ rep.nombre }}
                </option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">
                <i class="bi bi-arrow-left-right me-2"></i>{{ 'stock.movementForm.type' | translate }}
                <span class="text-danger">*</span>
              </label>
              <select class="form-select" [(ngModel)]="form.tipo">
                <option value="" disabled selected>{{ 'stock.movementForm.selectType' | translate }}</option>
                <option value="ENTRADA">
                  <i class="bi bi-arrow-down-circle-fill"></i> {{ 'stock.movementForm.typeIn' | translate }}
                </option>
                <option value="SALIDA">
                  <i class="bi bi-arrow-up-circle-fill"></i> {{ 'stock.movementForm.typeOut' | translate }}
                </option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">
                <i class="bi bi-123 me-2"></i>{{ 'stock.movementForm.quantity' | translate }}
                <span class="text-danger">*</span>
              </label>
              <input
                type="number"
                class="form-control"
                [placeholder]="'stock.movementForm.quantityPlaceholder' | translate"
                min="1"
                [(ngModel)]="form.cantidad"
              />
            </div>

            <div class="col-12">
              <label class="form-label">
                <i class="bi bi-chat-left-text me-2"></i>{{ 'stock.movementForm.note' | translate }}
                <small class="text-muted">{{ 'stock.movementForm.noteOptional' | translate }}</small>
              </label>
              <textarea
                class="form-control"
                rows="4"
                [placeholder]="'stock.movementForm.notePlaceholder' | translate"
                [(ngModel)]="form.observacion"
              ></textarea>
            </div>
          </div>
        </div>

        <!-- FOOTER -->
        <div class="form-footer">
          <button class="btn-cancelar" (click)="volver()">
            <i class="bi bi-x-lg me-2"></i>
            {{ 'common.cancel' | translate }}
          </button>

          <button
            class="btn-guardar"
            [disabled]="!form.idRepuesto || !form.tipo || !form.cantidad"
            (click)="registrar()"
          >
            <i class="bi bi-check-lg me-2"></i>
            {{ 'stock.movementForm.submit' | translate }}
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- 🔹 FOOTER -->
  <footer class="footer">
    
    <span class="version">v1.0.0</span>
  </footer>
</div>
