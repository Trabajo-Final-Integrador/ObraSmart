<div class="layout-container">
  <!-- 🔹 NAVBAR SUPERIOR -->
  <header class="top-navbar">
    <button class="menu-btn" (click)="volver()" title="Volver">
      <i class="bi bi-arrow-left"></i>
    </button>
    <h1 class="navbar-title">Registrar Movimiento de Stock</h1>
    <div class="navbar-actions">
      <button class="btn-regresar" routerLink="/principal" title="Regresar al inicio">
        <i class="bi bi-house-door"></i>
      </button>
      <app-helper tooltip="Registra entradas y salidas de stock para mantener actualizado tu inventario."></app-helper>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="content">
    <div class="form-container">
      <div class="form-card">
        <!-- HEADER -->
        <div class="form-header">
          <div class="header-content">
            <i class="bi bi-graph-up-arrow"></i>
            <div>
              <h2>Nuevo Movimiento</h2>
              <p>Registra una entrada o salida de stock para un repuesto específico</p>
            </div>
          </div>
        </div>

        <!-- FORMULARIO -->
        <div class="form-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">
                <i class="bi bi-box me-2"></i>Repuesto <span class="text-danger">*</span>
              </label>
              <select class="form-select" [(ngModel)]="form.idRepuesto">
                <option value="" disabled selected>Seleccionar repuesto</option>
                <option *ngFor="let rep of repuestos" [value]="rep.id">
                  {{ rep.codigo }} - {{ rep.nombre }}
                </option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">
                <i class="bi bi-arrow-left-right me-2"></i>Tipo de Movimiento <span class="text-danger">*</span>
              </label>
              <select class="form-select" [(ngModel)]="form.tipo">
                <option value="" disabled selected>Seleccionar tipo</option>
                <option value="ENTRADA">
                  <i class="bi bi-arrow-down-circle-fill"></i> Entrada
                </option>
                <option value="SALIDA">
                  <i class="bi bi-arrow-up-circle-fill"></i> Salida
                </option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">
                <i class="bi bi-123 me-2"></i>Cantidad <span class="text-danger">*</span>
              </label>
              <input
                type="number"
                class="form-control"
                placeholder="Ej: 10"
                min="1"
                [(ngModel)]="form.cantidad"
              />
            </div>

            <div class="col-12">
              <label class="form-label">
                <i class="bi bi-chat-left-text me-2"></i>Observación <small class="text-muted">(opcional)</small>
              </label>
              <textarea
                class="form-control"
                rows="4"
                placeholder="Motivo del movimiento, proveedor, cliente, etc."
                [(ngModel)]="form.observacion"
              ></textarea>
            </div>
          </div>
        </div>

        <!-- FOOTER -->
        <div class="form-footer">
          <button class="btn-cancelar" (click)="volver()">
            <i class="bi bi-x-lg me-2"></i>
            Cancelar
          </button>

          <button
            class="btn-guardar"
            [disabled]="!form.idRepuesto || !form.tipo || !form.cantidad"
            (click)="registrar()"
          >
            <i class="bi bi-check-lg me-2"></i>
            Registrar Movimiento
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- 🔹 FOOTER -->
  <footer class="footer">
    <span>Términos</span> | <span>Privacidad</span> | <span>Soporte</span>
    <span class="version">v1.0.0</span>
  </footer>
</div>
