<!-- 🟧 COMERCIAL -->
<div *ngIf="tabActiva === 'comercial'" class="grid grid-2">
  <div class="row g-3" >
  <div class="form-group col-md-6">
    <label>Especialidad</label>
    <input
      type="text"
      [(ngModel)]="nuevoProveedor.especialidad"
      placeholder="Ej: Repuestos hidráulicos"
      class="form-input"
    />
  </div>

  <div class="form-group col-md-6">
    <label>Tiempo de Entrega (días)</label>
    <input
      type="number"
      [(ngModel)]="nuevoProveedor.tiempoEntrega"
      class="form-input"
    />
  </div>

  <div class="form-group ">
    <label>Marcas que distribuye</label>
    <div class="flex gap">
      <input [(ngModel)]="marcaInput" placeholder="Agregar marca..." class="form-input" />
      <button type="button" (click)="agregarMarca()">➕</button>
    </div>
    <div class="marcas">
      <span *ngFor="let marca of marcas; let i = index">
        {{ marca }}
        <button type="button" (click)="eliminarMarca(i)">✖</button>
      </span>
    </div>
  </div>

  <div class="form-group col-md-6">
    <label>Pedido Mínimo ($)</label>
    <input
      type="number"
      [(ngModel)]="nuevoProveedor.pedidoMinimo"
      class="form-input"
    />
  </div>

  <div class="form-group col-md-6">
    <label>Descuento por Volumen (%)</label>
    <input
      type="number"
      [(ngModel)]="nuevoProveedor.descuentoVolumen"
      class="form-input"
    />
  </div>

  <div class="form-group">
    <label>Condiciones de Pago</label>
    <select [(ngModel)]="nuevoProveedor.condicionesPago" class="form-input">
      <option value="">Seleccionar...</option>
      <option value="Contado">Contado</option>
      <option value="30 días">30 días</option>
      <option value="60 días">60 días</option>
      <option value="90 días">90 días</option>
    </select>
  </div>

  <div class="check-group">
  <div className="grid grid-cols-2 gap-4">
    <label><input type="checkbox" [(ngModel)]="nuevoProveedor.tieneStock" /> Tiene stock propio</label>
    
    <label><input type="checkbox" [(ngModel)]="nuevoProveedor.haceEnvios" /> Hace envíos</label>
    <label><input type="checkbox" [(ngModel)]="nuevoProveedor.aceptaDevoluciones" /> Acepta devoluciones</label>
  </div>
  </div>

  <div *ngIf="nuevoProveedor.haceEnvios" class="form-group col-2">
    <label>Zona de Cobertura</label>
    <input
      type="text"
      [(ngModel)]="nuevoProveedor.zonaCobertura"
      placeholder="Ej: Córdoba Capital y alrededores"
      class="form-input"
    />
  </div>
</div>
<div class="col-span-2 text-end mt-4">
    <button class="btn-anterior" (click)="volver()">← Anterior</button>
    <button class="btn-siguiente" (click)="continuar()">Siguiente →</button>
  </div>
</div>
