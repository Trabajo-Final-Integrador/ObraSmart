<div class="layout-container">
  <!-- 🔹 NAVBAR SUPERIOR -->
  <header class="top-navbar">
    <div class="navbar-left">
      <button class="btn-back" routerLink="/stock/proveedores" [title]="'providers.actions.back' | translate">
        <i class="bi bi-arrow-left-circle"></i>
        <span>{{ 'providers.actions.back' | translate }}</span>
      </button>
      <div class="brand">
        <img src="assets/asistente/logo.png" alt="ObraSmart" class="logo-navbar" />
      </div>
      <div class="header-content">
       
        <div>
          <h3>{{ 'providers.form.createTitle' | translate }}</h3>
          <p>{{ 'providers.form.subtitle' | translate }}</p>
        </div>
      </div>
    </div>
    <div class="navbar-actions">
      <button class="btn-regresar" routerLink="/principal" [title]="'common.backHome' | translate">
        <i class="bi bi-house-door"></i>
      </button>
    </div>
  </header>

  <!-- 🔹 CONTENIDO PRINCIPAL -->
  <main class="content">
    <div class="form-container">
      <div class="form-card">
        <!-- HEADER con iconos de progreso -->
        

        <!-- STEPPER ÁGIL -->
        <div class="stepper">
          <button class="step-btn" [class.active]="pasoActual === 1" [class.done]="pasoActual > 1">
            1 · Datos básicos
          </button>
          <div class="step-divider"></div>
          <button class="step-btn" [class.active]="pasoActual === 2">
            2 · Contacto y opcionales
          </button>
        </div>

        <!-- FORMULARIO -->
        <div class="form-body">
          <!-- ====== PASO 1: ESENCIALES ====== -->
          <div *ngIf="pasoActual === 1">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">
                  <i class="bi bi-building me-2"></i>{{ 'providers.fields.companyName' | translate }} <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  [(ngModel)]="nuevoProveedor.razonSocial"
                  class="form-control"
                  [placeholder]="'providers.placeholders.companyName' | translate"
                  required
                />
              </div>

              <div class="col-md-6">
                <label class="form-label">
                  <i class="bi bi-shop me-2"></i>{{ 'providers.fields.tradeName' | translate }}
                </label>
                <input
                  type="text"
                  [(ngModel)]="nuevoProveedor.nombreComercial"
                  class="form-control"
                  [placeholder]="'providers.placeholders.tradeName' | translate"
                />
              </div>

              <div class="col-md-6">
                <label class="form-label">
                  <i class="bi bi-card-text me-2"></i>{{ 'providers.fields.taxId' | translate }} <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  [(ngModel)]="nuevoProveedor.cuit"
                  [placeholder]="'providers.placeholders.taxId' | translate"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-6">
                <label class="form-label">
                  <i class="bi bi-receipt me-2"></i>{{ 'providers.fields.taxCondition' | translate }} <span class="text-danger">*</span>
                </label>
                <select
                  [(ngModel)]="nuevoProveedor.condicionIVA"
                  class="form-select"
                  required
                >
                  <option value="">{{ 'providers.placeholders.taxCondition' | translate }}</option>
                  <option value="Responsable Inscripto">Responsable Inscripto</option>
                  <option value="Monotributista">Monotributista</option>
                  <option value="Exento">Exento</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label">
                  <i class="bi bi-toggles me-2"></i>{{ 'providers.fields.status' | translate }}
                </label>
                <div class="estado-radio-group">
                  <label class="radio-label">
                    <input
                      type="radio"
                      value="Activo"
                      [(ngModel)]="nuevoProveedor.estado"
                    />
                    <span class="radio-custom"></span>
                    <span class="radio-text">{{ 'providers.status.active' | translate }}</span>
                  </label>
                  <label class="radio-label">
                    <input
                      type="radio"
                      value="Inactivo"
                      [(ngModel)]="nuevoProveedor.estado"
                    />
                    <span class="radio-custom"></span>
                    <span class="radio-text">{{ 'providers.status.inactive' | translate }}</span>
                  </label>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label">
                  <i class="bi bi-telephone me-2"></i>{{ 'providers.fields.phone' | translate }} <span class="text-danger">*</span>
                </label>
                <input
                  type="tel"
                  [(ngModel)]="nuevoProveedor.telefono"
                  class="form-control"
                  [placeholder]="'providers.placeholders.phone' | translate"
                  required
                />
              </div>

              <div class="col-md-6">
                <label class="form-label">
                  <i class="bi bi-envelope me-2"></i>{{ 'providers.fields.email' | translate }} <span class="text-danger">*</span>
                </label>
                <input
                  type="email"
                  [(ngModel)]="nuevoProveedor.email"
                  class="form-control"
                  [placeholder]="'providers.placeholders.email' | translate"
                  required
                />
              </div>
            </div>
          </div>

          <!-- ====== PASO 2: CONTACTO + OPCIONALES ====== -->
          <div *ngIf="pasoActual === 2">
            <div class="section-card">
              <h4 class="section-title">Contacto y ubicación</h4>
              <div class="row g-3">
                <div class="col-12">
                  <label class="form-label">
                    <i class="bi bi-clock me-2"></i>{{ 'providers.fields.schedule' | translate }}
                  </label>
                  <input
                    type="text"
                    [(ngModel)]="nuevoProveedor.horarioAtencion"
                    [placeholder]="'providers.placeholders.schedule' | translate"
                    class="form-control"
                  />
                </div>

                <div class="col-12">
                  <label class="form-label">
                    <i class="bi bi-geo-alt me-2"></i>{{ 'providers.fields.address' | translate }} <span class="text-danger">*</span>
                  </label>
                  <input
                    type="text"
                    [(ngModel)]="nuevoProveedor.direccion"
                    class="form-control"
                    [placeholder]="'providers.placeholders.address' | translate"
                    required
                  />
                </div>

                <div class="col-md-4">
                  <label class="form-label">
                    <i class="bi bi-building me-2"></i>{{ 'providers.fields.city' | translate }} <span class="text-danger">*</span>
                  </label>
                  <input
                    type="text"
                    [(ngModel)]="nuevoProveedor.ciudad"
                    class="form-control"
                    [placeholder]="'providers.placeholders.city' | translate"
                    required
                  />
                </div>

                <div class="col-md-4">
                  <label class="form-label">
                    <i class="bi bi-map me-2"></i>{{ 'providers.fields.state' | translate }} <span class="text-danger">*</span>
                  </label>
                  <select
                    [(ngModel)]="nuevoProveedor.provincia"
                    class="form-select"
                    required
                  >
                    <option value="">{{ 'providers.placeholders.state' | translate }}</option>
                    <option *ngFor="let prov of provinciasArgentinas" [value]="prov">
                      {{ prov }}
                    </option>
                  </select>
                </div>

                <div class="col-md-4">
                  <label class="form-label">
                    <i class="bi bi-mailbox me-2"></i>{{ 'providers.fields.zip' | translate }}
                  </label>
                  <input
                    type="text"
                    [(ngModel)]="nuevoProveedor.codigoPostal"
                    class="form-control"
                    [placeholder]="'providers.placeholders.zip' | translate"
                  />
                </div>
              </div>
            </div>

            <div class="section-card">
              <h4 class="section-title">Opcionales</h4>
              <div class="section-toggles">
                <label class="toggle-item">
                  <input type="checkbox" [(ngModel)]="mostrarComercial" />
                  <span>Comercial</span>
                </label>
                <label class="toggle-item">
                  <input type="checkbox" [(ngModel)]="nuevoProveedor.tieneCatalogo" />
                  <span>Catálogo</span>
                </label>
                <label class="toggle-item">
                  <input type="checkbox" [(ngModel)]="mostrarBancario" />
                  <span>Bancario</span>
                </label>
              </div>
            </div>

            <div class="section-card" *ngIf="mostrarComercial">
              <h4 class="section-title">Comercial</h4>
              <app-step-comercio
                [tabActiva]="'comercial'"
                [nuevoProveedor]="nuevoProveedor"
                [forceShow]="true"
                [showActions]="false">
              </app-step-comercio>
            </div>

            <div class="section-card" *ngIf="nuevoProveedor.tieneCatalogo">
              <h4 class="section-title">Catálogo</h4>
              <app-step-catalogo
                [tabActiva]="'catalogo'"
                [nuevoProveedor]="nuevoProveedor"
                [forceShow]="true"
                [showActions]="false"
                [showToggle]="false">
              </app-step-catalogo>
            </div>

            <div class="section-card" *ngIf="mostrarBancario">
              <h4 class="section-title">Bancario</h4>
              <app-step-bancarios
                [tabActiva]="'bancario'"
                [nuevoProveedor]="nuevoProveedor"
                [forceShow]="true"
                [showActions]="false">
              </app-step-bancarios>
            </div>

            <div class="section-card">
              <h4 class="section-title">Observaciones</h4>
              <app-step-observaciones
                [tabActiva]="'observaciones'"
                [nuevoProveedor]="nuevoProveedor"
                [forceShow]="true"
                [showActions]="false">
              </app-step-observaciones>
            </div>
          </div>
        </div>

        <!-- FOOTER NAVIGATION -->
        <div class="form-footer" *ngIf="pasoActual === 1">
          <button class="btn-siguiente" (click)="irAPaso2()">
            {{ 'providers.actions.next' | translate }}
            <i class="bi bi-arrow-right ms-2"></i>
          </button>
        </div>
        <div class="form-footer" *ngIf="pasoActual === 2">
          <button class="btn-anterior" (click)="volverAPaso1()">
            <i class="bi bi-arrow-left me-2"></i>
            {{ 'providers.actions.prev' | translate }}
          </button>
          <button class="btn-guardar" (click)="guardarProveedor()">
            <i class="bi bi-check-lg me-2"></i>
            {{ 'providers.actions.save' | translate }}
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- 🔹 FOOTER -->
  <footer class="footer">
    
    <span class="version">v1.0.0</span>
  </footer>
</div>
