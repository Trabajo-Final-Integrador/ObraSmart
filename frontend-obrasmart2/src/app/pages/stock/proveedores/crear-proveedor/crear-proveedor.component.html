<div class="layout-container">
  <!-- 🔹 NAVBAR SUPERIOR -->
  <header class="top-navbar">
    <button class="menu-btn" routerLink="/stock/proveedores" title="Volver">
      <i class="bi bi-arrow-left"></i>
    </button>
     <div class="header-content">
            <i class="bi bi-building"></i>
            <div>
              <h3>Nuevo Proveedor</h3>
              <p>Complete la información en cada uno de los pasos</p>
            </div>
          </div>
    <div class="navbar-actions">
      <button class="btn-regresar" routerLink="/principal" title="Regresar al inicio">
        <i class="bi bi-house-door"></i>
      </button>
      <app-helper tooltip="Complete los datos del proveedor en cada uno de los pasos."></app-helper>
    </div>
  </header>

  <!-- 🔹 CONTENIDO PRINCIPAL -->
  <main class="content">
    <div class="form-container">
      <div class="form-card">
        <!-- HEADER con iconos de progreso -->
        

        <!-- TABS DE NAVEGACIÓN -->
        <div class="tabs-container">
          <button
            *ngFor="let tab of tabs"
            (click)="setTabActiva(tab.id)"
            [ngClass]="{ active: tabActiva === tab.id }"
            class="tab-btn"
          >
            <i [class]="tab.icon"></i>
            <span class="tab-label">{{ tab.label }}</span>
          </button>
        </div>

        <!-- FORMULARIO -->
        <div class="form-body">
          <!-- ====== TAB GENERAL ====== -->
          <div *ngIf="tabActiva === 'general'">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">
                  <i class="bi bi-building me-2"></i>Razón Social <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  [(ngModel)]="nuevoProveedor.razonSocial"
                  class="form-control"
                  placeholder="Ej: Distribuidora Argentina S.A."
                  required
                />
              </div>

              <div class="col-md-6">
                <label class="form-label">
                  <i class="bi bi-shop me-2"></i>Nombre Comercial
                </label>
                <input
                  type="text"
                  [(ngModel)]="nuevoProveedor.nombreComercial"
                  class="form-control"
                  placeholder="Ej: Casa del Repuesto"
                />
              </div>

              <div class="col-md-6">
                <label class="form-label">
                  <i class="bi bi-card-text me-2"></i>CUIT <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  [(ngModel)]="nuevoProveedor.cuit"
                  placeholder="XX-XXXXXXXX-X"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-6">
                <label class="form-label">
                  <i class="bi bi-receipt me-2"></i>Condición IVA <span class="text-danger">*</span>
                </label>
                <select
                  [(ngModel)]="nuevoProveedor.condicionIVA"
                  class="form-select"
                  required
                >
                  <option value="">Seleccionar...</option>
                  <option value="Responsable Inscripto">Responsable Inscripto</option>
                  <option value="Monotributista">Monotributista</option>
                  <option value="Exento">Exento</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label">
                  <i class="bi bi-toggles me-2"></i>Estado
                </label>
                <div class="estado-radio-group">
                  <label class="radio-label">
                    <input
                      type="radio"
                      value="Activo"
                      [(ngModel)]="nuevoProveedor.estado"
                    />
                    <span class="radio-custom"></span>
                    <span class="radio-text">Activo</span>
                  </label>
                  <label class="radio-label">
                    <input
                      type="radio"
                      value="Inactivo"
                      [(ngModel)]="nuevoProveedor.estado"
                    />
                    <span class="radio-custom"></span>
                    <span class="radio-text">Inactivo</span>
                  </label>
                </div>
              </div>
            </div>
          </div>

          <!-- ====== TAB CONTACTO ====== -->
          <app-step-contacto
            *ngIf="tabActiva === 'contacto'"
            [tabActiva]="tabActiva"
            [nuevoProveedor]="nuevoProveedor"
            (next)="irAlSiguiente('comercial')"
            (prev)="irAlAnterior('general')">
          </app-step-contacto>

          <!-- ====== TAB COMERCIAL ====== -->
          <app-step-comercio
            *ngIf="tabActiva === 'comercial'"
            [tabActiva]="tabActiva"
            [nuevoProveedor]="nuevoProveedor"
            (next)="irAlSiguiente('catalogo')"
            (prev)="irAlAnterior('contacto')">
          </app-step-comercio>

          <!-- ====== TAB CATÁLOGO ====== -->
          <app-step-catalogo
            *ngIf="tabActiva === 'catalogo'"
            [tabActiva]="tabActiva"
            [nuevoProveedor]="nuevoProveedor"
            (next)="irAlSiguiente('bancario')"
            (prev)="irAlAnterior('comercial')">
          </app-step-catalogo>

          <!-- ====== TAB BANCARIOS ====== -->
          <app-step-bancarios
            *ngIf="tabActiva === 'bancario'"
            [tabActiva]="tabActiva"
            [nuevoProveedor]="nuevoProveedor"
            (next)="irAlSiguiente('observaciones')"
            (prev)="irAlAnterior('catalogo')">
          </app-step-bancarios>

          <!-- ====== TAB OBSERVACIONES ====== -->
          <app-step-observaciones
            *ngIf="tabActiva === 'observaciones'"
            [tabActiva]="tabActiva"
            [nuevoProveedor]="nuevoProveedor"
            (prev)="irAlAnterior('bancario')"
            (guardar)="guardarProveedor()">
          </app-step-observaciones>
        </div>

        <!-- FOOTER NAVIGATION -->
        <div class="form-footer" *ngIf="tabActiva === 'general'">
          <!-- <button class="btn-cancelar" (click)="cancelar()">
            <i class="bi bi-x-lg me-2"></i>
            Cancelar
          </button> -->
          <button class="btn-siguiente" (click)="irAlSiguiente('contacto')">
            Siguiente
            <i class="bi bi-arrow-right ms-2"></i>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- 🔹 FOOTER -->
  <footer class="footer">
    <span>Términos</span> | <span>Privacidad</span> | <span>Soporte</span>
    <span class="version">v1.0.0</span>
  </footer>
</div>
