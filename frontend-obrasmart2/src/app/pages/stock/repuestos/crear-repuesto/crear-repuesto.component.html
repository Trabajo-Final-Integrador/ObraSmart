<div class="layout-container">
  <!-- 🔹 NAVBAR SUPERIOR -->
  <header class="top-navbar">
    <button class="btn-back" routerLink="/stock/repuestos" title="Volver al listado">
      <i class="bi bi-arrow-left-circle-fill"></i>
    </button>
    <div class="navbar-content">
      <h1 class="navbar-title">Nuevo Repuesto</h1>
    </div>
  </header>

  <!-- 🔹 CONTENIDO PRINCIPAL -->
  <main class="content">
    <div class="form-card">
      <div class="form-body">
        <!-- Fila 1: Código y Categoría -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Código <span class="required">*</span></label>
            <input type="text" class="form-control" [(ngModel)]="nuevoRepuesto.codigo" placeholder="Ej: REP-001" />
          </div>

          <div class="form-group">
            <label class="form-label">Categoría <span class="required">*</span></label>
            <select class="form-control" [(ngModel)]="nuevoRepuesto.idCategoria">
              <option [ngValue]="0">Seleccionar...</option>
              <option *ngFor="let c of categorias" [ngValue]="c.id">{{ c.nombre }}</option>
            </select>
          </div>
        </div>

        <!-- Fila 2: Nombre del Repuesto -->
        <div class="form-group">
          <label class="form-label">Nombre del Repuesto <span class="required">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="nuevoRepuesto.nombre" placeholder="Ej: Filtro de aceite" />
        </div>

        <!-- Fila 3: Unidad, Stock Inicial y Stock Mínimo -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Unidad de Medida <span class="required">*</span></label>
            <select class="form-control" [(ngModel)]="nuevoRepuesto.unidadMedida">
              <option value="">Seleccionar...</option>
              <option value="Unidad">Unidad</option>
              <option value="Caja">Caja</option>
              <option value="Paquete">Paquete</option>
              <option value="Litro">Litro</option>
              <option value="Kilogramo">Kilogramo</option>
              <option value="Metro">Metro</option>
              <option value="Juego">Juego</option>
              <option value="Par">Par</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Stock Inicial <span class="required">*</span></label>
            <input type="number" class="form-control" min="0" [(ngModel)]="nuevoRepuesto.stock" placeholder="0" />
          </div>
        </div>

        <!-- Fila 4: Stock Mínimo -->
        <div class="form-group">
          <label class="form-label">Stock Mínimo <span class="required">*</span></label>
          <input type="number" class="form-control" min="0" [(ngModel)]="nuevoRepuesto.stockMinimo" placeholder="0" />
        </div>

        <!-- Acciones -->
        <div class="form-actions">
          <button type="button" class="btn-secondary" (click)="cancelar()" [disabled]="isSubmitting">
            <i class="bi bi-x-lg"></i>
            <span>Cancelar</span>
          </button>
          <button type="button" class="btn-primary" (click)="guardarRepuesto()" [disabled]="isSubmitting">
            <i class="bi bi-check-lg"></i>
            <span>{{ isSubmitting ? 'Guardando...' : 'Guardar Repuesto' }}</span>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ============ MODAL NUEVA CATEGORÍA ============ -->
<div class="modal-backdrop fade show" *ngIf="isCategoryModalOpen"></div>

<div class="modal fade show d-block" tabindex="-1" role="dialog" *ngIf="isCategoryModalOpen">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="bi bi-bookmark-plus me-2"></i>Nueva Categoría
        </h5>
        <button type="button" class="btn-close" (click)="cerrarModalCategoria()"></button>
      </div>

      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Nombre de la categoría <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="newCategoriaNombre"
            placeholder="Ej: Transmisión"
            (keyup.enter)="guardarCategoria()" />
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="cerrarModalCategoria()">
          Cancelar
        </button>
        <button type="button" class="btn btn-primary" (click)="guardarCategoria()">
          <i class="bi bi-check-lg me-2"></i>Guardar
        </button>
      </div>
    </div>
  </div>
</div>
