<div class="layout-container">
  <!-- 🔹 NAVBAR SUPERIOR -->
  <header class="top-navbar">
    <button class="menu-btn" routerLink="/stock/repuestos" title="Volver">
      <i class="bi bi-arrow-left"></i>
    </button>
    <i class="bi bi-pencil-square"></i>
          <div>
            <h3>Editar Información del Repuesto</h3>
            <p>Modifica los detalles del repuesto en el inventario</p>
          </div>
    <div class="navbar-actions">
      <button class="btn-regresar" routerLink="/principal" title="Regresar al inicio">
        <i class="bi bi-house-door"></i>
      </button>
      <app-helper tooltip="Modifique los campos necesarios para actualizar el repuesto."></app-helper>
    </div>
  </header>

  <!-- 🔹 CONTENIDO PRINCIPAL -->
  <main class="content">
    <div class="form-container">
      <div class="form-card">
        

        <div *ngIf="loading" class="loading-container">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
          <p>Cargando información del repuesto...</p>
        </div>

        <div *ngIf="!loading">
          <div class="form-body">
            <div class="row">
              <!-- Código -->
              <div class="col-md-6 mb-3">
                <label class="form-label">
                  <i class="bi bi-upc-scan me-2"></i>Código <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="repuesto.codigo"
                  placeholder="Ej: REP-001" />
              </div>

              <!-- Categoría -->
              <div class="col-md-6 mb-3">
                <label class="form-label">
                  <i class="bi bi-bookmark me-2"></i>Categoría <span class="text-danger">*</span>
                </label>
                <div class="d-flex gap-2">
                  <select class="form-select" [(ngModel)]="repuesto.idCategoria">
                    <option [ngValue]="0">Seleccionar...</option>
                    <option *ngFor="let c of categorias" [ngValue]="c.id">
                      {{ c.nombre }}
                    </option>
                  </select>
                  <button class="btn btn-add-category" (click)="abrirModalCategoria()" title="Nueva categoría">
                    <i class="bi bi-plus-lg"></i>
                  </button>
                </div>
              </div>

              <!-- Nombre -->
              <div class="col-12 mb-3">
                <label class="form-label">
                  <i class="bi bi-tag me-2"></i>Nombre del Repuesto <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="repuesto.nombre"
                  placeholder="Ej: Filtro de aceite" />
              </div>

              <!-- Unidad de Medida -->
              <div class="col-md-4 mb-3">
                <label class="form-label">
                  <i class="bi bi-rulers me-2"></i>Unidad de Medida <span class="text-danger">*</span>
                </label>
                <select class="form-select" [(ngModel)]="repuesto.unidadMedida">
                  <option value="">Seleccionar...</option>
                  <option value="Unidad">Unidad</option>
                  <option value="Caja">Caja</option>
                  <option value="Paquete">Paquete</option>
                  <option value="Litro">Litro</option>
                  <option value="Kilogramo">Kilogramo</option>
                  <option value="Metro">Metro</option>
                  <option value="Juego">Juego</option>
                  <option value="Par">Par</option>
                </select>
              </div>

              <!-- Stock Actual -->
              <div class="col-md-4 mb-3">
                <label class="form-label">
                  <i class="bi bi-box me-2"></i>Stock Actual <span class="text-danger">*</span>
                </label>
                <input
                  type="number"
                  class="form-control"
                  min="0"
                  [(ngModel)]="repuesto.stock"
                  placeholder="0" />
              </div>

              <!-- Stock Mínimo -->
              <div class="col-md-4 mb-3">
                <label class="form-label">
                  <i class="bi bi-exclamation-triangle me-2"></i>Stock Mínimo <span class="text-danger">*</span>
                </label>
                <input
                  type="number"
                  class="form-control"
                  min="0"
                  [(ngModel)]="repuesto.stockMinimo"
                  placeholder="0" />
              </div>
            </div>
          </div>

          <div class="form-footer">
            <button class="btn-cancelar" (click)="cancelar()" [disabled]="isSubmitting">
              <i class="bi bi-x-lg me-2"></i>
              Cancelar
            </button>
            <button class="btn-guardar" (click)="actualizarRepuesto()" [disabled]="isSubmitting">
              <i class="bi bi-check-lg me-2"></i>
              {{ isSubmitting ? 'Actualizando...' : 'Actualizar Repuesto' }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 🔹 FOOTER -->
  <footer class="footer">
    <span>Términos</span> | <span>Privacidad</span> | <span>Soporte</span>
    <span class="version">v1.0.0</span>
  </footer>
</div>

<!-- ============ MODAL NUEVA CATEGORÍA ============ -->
<div class="modal-backdrop fade show" *ngIf="isCategoryModalOpen"></div>

<div class="modal fade show d-block" tabindex="-1" role="dialog" *ngIf="isCategoryModalOpen">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="bi bi-bookmark-plus me-2"></i>Nueva Categoría
        </h5>
        <button type="button" class="btn-close" (click)="cerrarModalCategoria()"></button>
      </div>

      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Nombre de la categoría <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="newCategoriaNombre"
            placeholder="Ej: Transmisión"
            (keyup.enter)="guardarCategoria()" />
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="cerrarModalCategoria()">
          Cancelar
        </button>
        <button type="button" class="btn btn-primary" (click)="guardarCategoria()">
          <i class="bi bi-check-lg me-2"></i>Guardar
        </button>
      </div>
    </div>
  </div>
</div>
