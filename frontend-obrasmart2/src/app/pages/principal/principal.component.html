<div class="dashboard">
  <header class="navbar">
    <button class="menu-btn" (click)="toggleMenu()">
      <i class="bi bi-list"></i>
    </button>
    <div class="navbar-title">
      <img src="assets/asistente/logo.png" class="logo-navbar me-2" />
      <span class="brand-text">Obra<span class="highlight">Smart</span></span>
    </div>
    <div class="navbar-actions">
     
      <button class="nav-icon-btn" (click)="toggleUserMenu()" title="Usuario">
        <i class="bi bi-person-circle"></i>
      </button>
      <div class="user-menu" *ngIf="userMenuAbierto">
        <button class="logout-btn" (click)="cerrarSesion()">
          <i class="bi bi-box-arrow-right"></i> Cerrar sesión
        </button>
      </div>
    </div>
  </header>

  <!-- ✅ Sidebar compartido (tipo full con header y submenus) -->
  <app-sidebar [type]="'full'"></app-sidebar>

  <!-- ✅ Modales compartidos -->
  <app-modal-info></app-modal-info>

  <div class="map-container">
    <div id="map"></div>
  </div>

  <footer class="footer-bar">
    <span class="version">v1.0.0</span>
  </footer>

  <!-- ASISTENTE GLOBAL (burbuja + chat) -->
  <app-chat-asistente></app-chat-asistente>
</div>
