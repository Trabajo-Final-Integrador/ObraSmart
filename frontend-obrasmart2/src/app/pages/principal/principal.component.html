<div class="dashboard">
  <header class="navbar">
    <button class="menu-btn" (click)="toggleMenu()">
      <i class="bi bi-list"></i>
    </button>
    <div class="navbar-title">
      <img src="assets/asistente/logo.png" class="logo-navbar me-2" />
      <span class="brand-text">Obra<span class="highlight">Smart</span></span>
    </div>
    <div class="navbar-actions">
      <button class="nav-icon-btn config-btn" (click)="toggleConfigMenu()" [title]="'navbar.config' | translate">
        <i class="bi bi-gear"></i>
      </button>
      <div class="avatar-wrapper">
        <img [src]="avatarSrc" (error)="onAvatarError($event)" alt="Usuario" class="user-avatar" />
      </div>
      <button class="nav-icon-btn nav-logout-btn" (click)="cerrarSesion()" [title]="'logout' | translate">
        <i class="bi bi-box-arrow-right"></i><span class="logout-label">{{ 'logout' | translate }}</span>
      </button>
    </div>
  </header>

  <!-- ✅ Sidebar compartido (tipo full con header y submenus) -->
  <app-sidebar [type]="'full'"></app-sidebar>

  <!-- ✅ Modales compartidos -->
  <app-modal-info></app-modal-info>
  <div class="config-menu" *ngIf="configMenuAbierto">
    <div class="config-section">
      <p class="config-title">{{ 'language.label' | translate }}</p>
      <div class="config-options">
        <button type="button" *ngFor="let lang of languageOptions"
          [class.active]="selectedLanguage === lang.id"
          (click)="seleccionarIdioma(lang.id)">
          <span>✔</span>{{ lang.labelKey | translate }}
        </button>
      </div>
    </div>
    <div class="config-section">
      <p class="config-title">{{ 'navbar.theme' | translate }}</p>
      <div class="config-options">
        <button type="button" *ngFor="let theme of themeOptions"
          [class.active]="selectedThemeId === theme.id"
          (click)="seleccionarTheme(theme.id)">
          <span>✔</span>{{ theme.labelKey | translate }}
        </button>
      </div>
    </div>
  </div>

  <div class="map-container">
    <div class="map-controls" (clickOutside)="closeThemeMenu()">
      <button class="theme-pill" (click)="toggleThemeMenu()" type="button">
        <span class="icon" aria-hidden="true">🗺️</span>
        <span class="label">{{ 'navbar.map.label' | translate }}: {{ getThemeLabel(baseThemeId) | translate }}</span>
        <i class="bi" [ngClass]="{ 'bi-chevron-up': themeMenuAbierto, 'bi-chevron-down': !themeMenuAbierto }"></i>
      </button>

      <div class="theme-popover" *ngIf="themeMenuAbierto">
        <button type="button" *ngFor="let theme of themeOptions"
                [class.active]="baseThemeId === theme.id"
                (click)="onBaseThemeSelect(theme.id); closeThemeMenu()">
          <span>✔</span> {{ theme.labelKey | translate }}
        </button>
      </div>

      <!-- select oculto para mantener compatibilidad -->
      <select id="base-theme" #baseThemeSelect [value]="baseThemeId" (change)="onBaseThemeSelect(baseThemeSelect.value)" aria-hidden="true" tabindex="-1" class="visually-hidden">
        <option value="carto-positron">{{ 'navbar.map.themes.carto-positron' | translate }}</option>
        <option value="carto-darkmatter">{{ 'navbar.map.themes.carto-darkmatter' | translate }}</option>
        <option value="osm-classic">{{ 'navbar.map.themes.osm-classic' | translate }}</option>
        <option value="carto-voyager">{{ 'navbar.map.themes.carto-voyager' | translate }}</option>
        <option value="opentopo">{{ 'navbar.map.themes.opentopo' | translate }}</option>
        <option value="osm-hot">{{ 'navbar.map.themes.osm-hot' | translate }}</option>
      </select>
    </div>
    <div id="map"></div>
  </div>

  <app-equipo-detalle-modal
    [visible]="detalleVisible"
    [equipoId]="selectedEquipoId"
    (closed)="cerrarDetalleEquipo()"
  ></app-equipo-detalle-modal>

  <footer class="footer-bar">
    <span class="version">v1.0.0</span>
  </footer>

  <!-- ASISTENTE GLOBAL (burbuja + chat) -->
  <app-chat-asistente></app-chat-asistente>
</div>
