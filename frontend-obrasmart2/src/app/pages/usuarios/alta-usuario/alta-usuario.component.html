<div class="layout-container">
  <!-- Navbar superior -->
  <header class="top-navbar">
    <div class="navbar-left">
      <button class="menu-btn" (click)="toggleMenu()" title="Menú">
        <i class="bi bi-list"></i>
      </button>
      <div class="brand">
        <img src="assets/asistente/logo.png" alt="ObraSmart" class="logo-navbar" />
        <span class="brand-text">Registrar Usuario</span>
      </div>
    </div>
    <div class="navbar-actions">
      <button class="nav-btn ghost" routerLink="/principal" title="Volver al inicio">
        <i class="bi bi-house-door"></i>
      </button>
      <app-helper tooltip="Completa los datos para crear un nuevo usuario."></app-helper>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar" [class.open]="menuAbierto">
    <div class="sidebar-header">
      <h3><i class="bi bi-grid-3x3-gap me-2"></i>Menú Principal</h3>
      <button class="close-sidebar-btn" (click)="toggleMenu()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <ul class="nav flex-column sidebar-menu">
      <li class="nav-item">
        <a class="nav-link" routerLink="/principal" (click)="toggleMenu()"><i class="bi bi-house-door me-2"></i> Inicio</a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" routerLink="/alta-usuario" (click)="toggleMenu()"><i class="bi bi-people me-2"></i> Usuarios</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/reparaciones/dashboard" (click)="toggleMenu()"><i class="bi bi-tools me-2"></i> Reparaciones</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/equipos" (click)="toggleMenu()"><i class="bi bi-truck-flatbed me-2"></i> Equipos</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/stock/dashboard" (click)="toggleMenu()"><i class="bi bi-box-seam me-2"></i> Stock</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/reportes" (click)="toggleMenu()"><i class="bi bi-file-bar-graph me-2"></i> Reportes</a>
      </li>
    </ul>
    <div class="sidebar-footer">
      <div class="links">
        <a href="#" (click)="$event.preventDefault()">Términos</a>
        <span class="separator">|</span>
        <a href="#" (click)="$event.preventDefault()">Privacidad</a>
        <span class="separator">|</span>
        <a href="#" (click)="$event.preventDefault()">Soporte</a>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" [class.active]="menuAbierto" (click)="toggleMenu()"></div>

  <!-- Contenido principal -->
  <main class="page-container">
    <div class="card form-card shadow">
      <div class="card-body">
        <h3 class="card-title mb-4 text-center text-dark">Registrar Usuario</h3>

        <form (ngSubmit)="crearUsuario()" #formUsuario="ngForm">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" [(ngModel)]="usuario.firstname" name="firstname" required placeholder="Ingrese nombre" />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Apellido</label>
              <input type="text" class="form-control" [(ngModel)]="usuario.lastname" name="lastname" required placeholder="Ingrese apellido" />
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" [(ngModel)]="usuario.email" name="email" required placeholder="usuario@email.com" />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Usuario</label>
              <input type="text" class="form-control" [(ngModel)]="usuario.username" name="username" required placeholder="Ingrese nombre de usuario" />
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" [(ngModel)]="usuario.password" name="password" required placeholder="Ingrese contraseña" />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Rol</label>
              <select class="form-select" [(ngModel)]="usuario.role" name="role" required>
                <option value="ADMINISTRADOR">Administrador</option>
                <option value="TECNICO">Técnico</option>
                <option value="OPERARIO">Operario</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Estado</label>
              <select class="form-select" [(ngModel)]="usuario.status" name="status" required>
                <option value="ACTIVO">Activo</option>
                <option value="INACTIVO">Inactivo</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Observaciones</label>
              <textarea class="form-control" rows="3" [(ngModel)]="usuario.observaciones" name="observaciones" placeholder="Notas opcionales..."></textarea>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-3 form-actions">
            <button type="button" class="btn btn-light" routerLink="/listado-usuario">Cancelar</button>
            <button type="submit" class="btn btn-success d-flex align-items-center gap-2">
              <i class="bi bi-person-plus"></i>
              Crear Usuario
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer-bar">
    <div class="footer-version">v1.0.0</div>
  </footer>
</div>
