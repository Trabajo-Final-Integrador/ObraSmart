<div class="layout-container">
  <!-- Navbar superior -->
  <header class="top-navbar">
    <div class="navbar-left">
       <button class="btn-back" routerLink="/listado-usuario" title="Volver al listado">
        <i class="bi bi-arrow-left-circle"></i>
        <span>Volver</span>
      </button>
      <div class="brand">
        <img src="assets/asistente/logo.png" alt="ObraSmart" class="logo-navbar" />
        <span class="brand-text">Registrar Usuario</span>
      </div>
    </div>
    <div class="navbar-actions">
      <button class="nav-btn ghost" routerLink="/principal" title="Volver al inicio">
        <i class="bi bi-house-door"></i>
      </button>
      <app-helper tooltip="Completa los datos para crear un nuevo usuario."></app-helper>
    </div>
  </header>

  <!-- Sidebar compartido -->
  <app-sidebar [type]="'simplified'"></app-sidebar>

  <!-- Modales compartidos -->
  <app-modal-info></app-modal-info>

  <!-- Contenido principal -->
  <main class="page-container">
    <div class="card form-card shadow">
      <div class="card-body">
        <h3 class="card-title mb-4 text-center text-dark">Registrar Usuario</h3>

        <form (ngSubmit)="crearUsuario()" #formUsuario="ngForm">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" [(ngModel)]="usuario.firstname" name="firstname" required placeholder="Ingrese nombre" />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Apellido</label>
              <input type="text" class="form-control" [(ngModel)]="usuario.lastname" name="lastname" required placeholder="Ingrese apellido" />
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" [(ngModel)]="usuario.email" name="email" required placeholder="usuario@email.com" />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Usuario</label>
              <input type="text" class="form-control" [(ngModel)]="usuario.username" name="username" required placeholder="Ingrese nombre de usuario" />
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" [(ngModel)]="usuario.password" name="password" required placeholder="Ingrese contraseña" />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Rol</label>
              <select class="form-select" [(ngModel)]="usuario.role" name="role" required>
                <option value="ADMINISTRADOR">Administrador</option>
                <option value="TECNICO">Técnico</option>
                <option value="OPERARIO">Operario</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Estado</label>
              <select class="form-select" [(ngModel)]="usuario.status" name="status" required>
                <option value="ACTIVO">Activo</option>
                <option value="INACTIVO">Inactivo</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Observaciones</label>
              <textarea class="form-control" rows="3" [(ngModel)]="usuario.observaciones" name="observaciones" placeholder="Notas opcionales..."></textarea>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-3 form-actions">
            <button type="button" class="btn btn-light" routerLink="/listado-usuario">Cancelar</button>
            <button type="submit" class="btn btn-success d-flex align-items-center gap-2">
              <i class="bi bi-person-plus"></i>
              Crear Usuario
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer-bar">
    <div class="footer-version">v1.0.0</div>
  </footer>
</div>
