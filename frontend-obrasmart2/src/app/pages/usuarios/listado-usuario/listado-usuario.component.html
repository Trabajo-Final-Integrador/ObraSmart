<div class="layout-container">
  <!-- 🔹 NAVBAR SUPERIOR -->
  <header class="top-navbar">
    <div class="navbar-left">
      <button class="menu-btn" (click)="toggleSidebar()" title="Menú principal">
        <i class="bi bi-list"></i>
      </button>
      <div class="brand">
        <img src="assets/asistente/logo.png" alt="ObraSmart" class="logo-navbar" />
        <h1 class="navbar-title">Listado de Usuarios</h1>
      </div>
    </div>
    <div class="navbar-actions">
      <button class="btn-regresar" routerLink="/principal" title="Volver al inicio">
        <i class="bi bi-house-door-fill"></i>
        
      </button>
      
    </div>
  </header>

  <!-- Sidebar compartido -->
  <app-sidebar [type]="'full'"></app-sidebar>

  <!-- Modales compartidos -->
  <app-modal-info></app-modal-info>

  <!-- 🔹 CONTENIDO PRINCIPAL -->
  <main class="content">
    <!-- 🔸 Tabla -->
    <div class="table-container">
      <div class="toolbar">
        <div class="search-container">
          <i class="bi bi-search"></i>
          <input
            type="text"
            [(ngModel)]="filtro"
            placeholder="Buscar por usuario, email o rol"
          />
          
        </div>
      </div>

      <table class="styled-table">
        <thead>
          <tr>
            <th>Email</th>
            <th>Usuario</th>
            <th>Rol</th>
            <th>Estado</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of usuariosPaginados">
            <td>{{ u.email }}</td>
            <td>{{ u.username }}</td>
            <td>{{ u.role }}</td>
            <td>
              <span
                class="badge"
                [ngClass]="
                  u.status === 'ACTIVO' ? 'badge-success' : 'badge-danger'
                "
              >
                {{ u.status }}
              </span>
            </td>
            <td class="acciones">
              <button class="btn-icon edit" (click)="editar(u)" title="Editar">
                <i class="bi bi-pencil"></i>
              </button>
              <button
                class="btn-icon delete"
                (click)="eliminar(u.id)"
                title="Eliminar"
              >
                <i class="bi bi-trash"></i>
              </button>
              <button class="btn-icon view" (click)="verUsuario(u)" title="Ver información">
                <i class="bi bi-eye"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <div *ngIf="usuariosFiltrados.length === 0 && usuarios.length > 0" class="empty-message">
        <i class="bi bi-search"></i>
        <p>No se encontraron usuarios que coincidan con "{{ filtro }}"</p>
      </div>

      <div *ngIf="usuarios.length === 0" class="empty-message">
        <i class="bi bi-exclamation-circle"></i>
        <p>No hay usuarios registrados.</p>
      </div>
    </div>

    <!-- 🔸 Paginación fuera de la card -->
    <div class="pagination-wrapper" *ngIf="usuariosFiltrados.length > 0">
      <div class="pagination-controls">
        <select [(ngModel)]="usuariosPorPagina" (change)="paginaActual = 1" class="items-per-page">
          <option *ngFor="let n of [5, 10, 20, 50]" [value]="n">{{ n }}</option>
        </select>
        <div class="pagination-buttons">
          <button (click)="primeraPagina()" [disabled]="paginaActual === 1" class="page-btn" title="Primera página">
            &laquo;
          </button>
          <button (click)="paginaAnterior()" [disabled]="paginaActual === 1" class="page-btn" title="Anterior">
            &lsaquo;
          </button>
          <span class="page-indicator">Página {{ paginaActual }} de {{ totalPaginas }}</span>
          <button (click)="paginaSiguiente()" [disabled]="paginaActual === totalPaginas" class="page-btn" title="Siguiente">
            &rsaquo;
          </button>
          <button (click)="ultimaPagina()" [disabled]="paginaActual === totalPaginas" class="page-btn" title="Última página">
            &raquo;
          </button>
        </div>
      </div>
    </div>
  </main>

  <app-modal-usuario 
  *ngIf="mostrarModal"
  [usuario]="usuarioEdit"
  (cerrar)="cerrarModal()"
  (guardar)="onUsuarioActualizado()">
</app-modal-usuario>

  <!-- 🔹 FOOTER -->
  <footer class="footer">
    
    <span class="version">v1.0.0</span>
  </footer>
</div>
