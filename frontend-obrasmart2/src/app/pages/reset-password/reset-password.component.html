
<div class="recuperar-page">
  <div class="overlay"></div>
  <div class="card">
    <h2>Recuperar contraseña</h2>
    <p>Ingrese su correo electrónico y una nueva contraseña.</p>

    <form (ngSubmit)="submit()" [formGroup]="form">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" formControlName="email" placeholder="Ingrese su email" required />

      
      <label for="password">Nueva contraseña</label>
      <input type="password" id="password" name="password" formControlName="password" placeholder="Nueva contraseña" required />

      

      <label for="confirm">Repetir contraseña</label>
      <input type="password" id="confirm" name="confirm" formControlName="confirm"  placeholder="Repetir contraseña" required />

      <button type="submit" [disabled]="loading || form.invalid">{{ loading ? 'Procesando...' : 'Restablecer contraseña' }}</button>

      <a routerLink="/auth/login"  class="volver">Volver al inicio de sesión</a>
    </form>
    <div *ngIf="msg" class="chip" style="margin-top:1rem">{{ msg }}</div>
  

  </div>
  </div>
