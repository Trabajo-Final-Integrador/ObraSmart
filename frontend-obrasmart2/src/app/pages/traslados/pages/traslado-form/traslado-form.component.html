<div class="layout-container">
  <header class="top-navbar">
    <div class="navbar-left">
      <button class="menu-btn" (click)="toggleSidebar()" [title]="'menu.main' | translate">
        <i class="bi bi-list"></i>
      </button>
      <div class="brand">
        <img src="assets/asistente/logo.png" alt="ObraSmart" class="logo-navbar" />
      </div>
      <h1 class="navbar-title">Nuevo traslado</h1>
    </div>
    <div class="navbar-actions">
      <button class="btn-regresar" routerLink="/principal" [title]="'common.backHome' | translate">
        <i class="bi bi-house-door-fill"></i>
      </button>
      <button class="btn-regresar" routerLink="/traslados" title="Volver">
        <i class="bi bi-arrow-left-circle"></i>
      </button>
    </div>
  </header>

  <app-sidebar [type]="'full'" [showConfigButton]="true"></app-sidebar>
  <app-modal-info></app-modal-info>

  <main class="content">
   

    <form [formGroup]="form" (ngSubmit)="guardar()">
      <div class="card">
        <div class="form-grid">
          <label>
            Equipo
            <select formControlName="equipoId" required (ngModelChange)="onEquipoChange($event)">
              <option [ngValue]="null">Selecciona equipo</option>
              <option *ngFor="let eq of equipos" [ngValue]="eq.id">{{ eq.nombre || eq.codigoInterno }}</option>
            </select>
          </label>

          <label>
            Origen (Ubicación actual)
            <input type="text" [value]="origenUbicacion" readonly />
          </label>

          <label>
            Destino (Obrador)
            <select formControlName="destinoObradorId" required>
              <option [ngValue]="null">Selecciona obrador</option>
              <option *ngFor="let o of obradores" [ngValue]="o.id">
                {{ o.nombre }} {{ o.ubicacion ? ('- ' + o.ubicacion) : '' }}
              </option>
            </select>
          </label>

          <label>
            Programado para
            <input type="datetime-local" formControlName="programadoPara" />
          </label>

          <label class="full">
            Notas
            <textarea rows="3" formControlName="notas"></textarea>
          </label>
        </div>

        <div class="actions">
          <button type="submit" class="btn-nuevo" [disabled]="loading || !puedeCrear">
            <i class="bi bi-check-lg"></i>
            <span>Crear traslado</span>
          </button>
          <span *ngIf="loading">Guardando...</span>
          <span class="error" *ngIf="!puedeCrear">Requiere rol SUPERVISOR o ADMINISTRACION.</span>
          <span class="error" *ngIf="error">{{ error }}</span>
        </div>
      </div>
    </form>
  </main>

  <footer class="footer">
    <span class="version">v1.0.0</span>
  </footer>
</div>
