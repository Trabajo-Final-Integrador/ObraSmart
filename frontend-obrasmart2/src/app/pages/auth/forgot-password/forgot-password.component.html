<div class="recuperar-page">
  <div class="overlay"></div>
  <div class="card">
    
    <!-- Formulario para solicitar recuperación -->
    <div *ngIf="!success">
      <h2>Recuperar contraseña</h2>
      <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>

      <form (ngSubmit)="submit()" [formGroup]="form">
        <label for="email">Correo electrónico</label>
        <input 
          type="email" id="email" name="email" formControlName="email" placeholder="tu@email.com"  required autofocus/>

        <!-- Mensaje de validación -->
        <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="error-text">
          Por favor ingresa un email válido
        </div>

        <button type="submit" [disabled]="loading || form.invalid">
          {{ loading ? 'Enviando...' : 'Enviar enlace de recuperación' }}
        </button>

        <a routerLink="/auth/login" class="volver">Volver al inicio de sesión</a>
      </form>

      <!-- Mensaje de error -->
      <div *ngIf="msg && !success" class="chip error">{{ msg }}</div>
    </div>

    <!-- Mensaje de éxito -->
    <div *ngIf="success" class="success-message">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <h3>¡Correo enviado!</h3>
      <p class="success-text">{{ msg }}</p>
      <p class="hint">Revisa tu bandeja de entrada y sigue las instrucciones.</p>
      <button (click)="backToLogin()" class="btn-primary">Volver al inicio de sesión</button>
    </div>

  </div>
</div>
