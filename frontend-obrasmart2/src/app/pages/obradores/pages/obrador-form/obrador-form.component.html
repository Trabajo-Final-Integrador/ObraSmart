<div class="layout-container">
  <header class="top-navbar">
    <div class="navbar-left">
      <button class="menu-btn" (click)="toggleSidebar()" [title]="'menu.main' | translate">
        <i class="bi bi-list"></i>
      </button>
      <div class="brand">
        <img src="assets/asistente/logo.png" alt="ObraSmart" class="logo-navbar" />
        <span class="navbar-title">{{ isEdit ? ('obradores.editTitle' | translate) : ('obradores.newTitle' | translate) }}</span>
      </div>
    </div>
    <div class="navbar-actions">
      <button class="btn-regresar" routerLink="/principal" [title]="'common.backHome' | translate">
        <i class="bi bi-house-door-fill"></i>
      </button>
      <button class="btn-regresar" routerLink="/obradores" [title]="'common.back' | translate">
        <i class="bi bi-arrow-left-circle"></i>
      </button>
    </div>
  </header>

  <app-sidebar [type]="'full'"></app-sidebar>
  <app-modal-info></app-modal-info>

  <main class="content">
    <div class="card">
      <form [formGroup]="form" (ngSubmit)="guardar()">
        <div class="form-grid">
          <label>
            {{ 'obradores.fields.name' | translate }}
            <input type="text" formControlName="nombre" required />
          </label>

          <label>
            {{ 'obradores.fields.address' | translate }}
            <input type="text" formControlName="ubicacion" (blur)="onUbicacionBlur()" />
            <small *ngIf="geocodificando">Buscando coordenadas...</small>
            <small class="error" *ngIf="geocodingError">{{ geocodingError }}</small>
          </label>

          <label>
            {{ 'obradores.fields.lat' | translate }}
            <input type="number" step="0.000001" formControlName="lat" />
          </label>

          <label>
            {{ 'obradores.fields.lng' | translate }}
            <input type="number" step="0.000001" formControlName="lng" />
          </label>

          <label>
            {{ 'obradores.fields.state' | translate }}
            <select formControlName="estado">
              <option value="ACTIVO">ACTIVO</option>
              <option value="INACTIVO">INACTIVO</option>
            </select>
          </label>

          <label>
            {{ 'obradores.fields.supervisor' | translate }}
            <select formControlName="supervisorUserId">
              <option [ngValue]="null">-- {{ 'common.noData' | translate }} --</option>
              <option *ngFor="let u of supervisores" [ngValue]="u.id">
                {{ (u.firstname + ' ' + u.lastname) || u.username || u.email }}
              </option>
            </select>
          </label>
        </div>

        <div class="actions">
          <button type="submit" class="btn primary" [disabled]="loading">
            {{ isEdit ? ('obradores.editTitle' | translate) : ('obradores.newTitle' | translate) }}
          </button>
          <button type="button" class="btn ghost" (click)="cancelar()">{{ 'common.cancel' | translate }}</button>
          <span *ngIf="loading">Guardando...</span>
          <span class="error" *ngIf="error">{{ error }}</span>
        </div>
      </form>
    </div>

    <section *ngIf="isEdit" class="equipos-section card">
      <div class="equipos-header">
        <h3>Equipos del obrador</h3>
      </div>
      <div class="equipos-actions">
        <select [(ngModel)]="equipoSeleccionado">
          <option [ngValue]="null">Selecciona equipo</option>
          <option *ngFor="let eq of equiposDisponibles" [ngValue]="eq.id">{{ eq.nombre || eq.codigoInterno }}</option>
        </select>
        <button class="btn primary" (click)="asignarEquipo()" [disabled]="!equipoSeleccionado">Asignar equipo</button>
      </div>
      <table class="table" *ngIf="equiposAsignados.length">
        <thead>
          <tr>
            <th>Equipo</th>
            <th>Código</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let eq of equiposAsignados">
            <td>{{ eq.nombre }}</td>
            <td>{{ eq.codigoInterno }}</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
  <footer class="footer">
    <span class="version">v1.0.0</span>
  </footer>
</div>
