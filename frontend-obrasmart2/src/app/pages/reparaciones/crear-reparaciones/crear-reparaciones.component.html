<div class="layout-container">
  <!-- 🔹 NAVBAR SUPERIOR -->
  <header class="top-navbar">
    <div class="navbar-left">
      <button class="btn-back" routerLink="/reparaciones/listado" title="Volver al listado">
        <i class="bi bi-arrow-left-circle"></i>
        <span>Volver</span>
      </button>
      <div class="navbar-title">
        <i class="bi bi-tools"></i>
        <h1>Nueva Reparación</h1>
      </div>
    </div>

    <div class="navbar-actions">
      <button class="btn-regresar" routerLink="/principal" title="Regresar al inicio">
        <i class="bi bi-house-door"></i>
      </button>
    </div>
  </header>

  <!-- 🔹 CONTENIDO PRINCIPAL -->
  <main class="content">
    <div class="form-card">
     

      <form (ngSubmit)="guardar()" class="card-body">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">
              Equipo <span class="required">*</span>
            </label>
            <select class="form-control"
                    [(ngModel)]="nueva.equipoId"
                    name="equipoId"
                    required>
              <option [ngValue]="null">Seleccionar equipo...</option>
              <option *ngFor="let eq of equipos" [value]="eq.id">
                {{ eq.nombre }} - {{ eq.numeroSerie }}
              </option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">
              Tipo de Mantenimiento <span class="required">*</span>
            </label>
            <select class="form-control"
                    [(ngModel)]="nueva.tipoMantenimiento"
                    name="tipoMantenimiento"
                    required>
              <option value="">Seleccionar tipo...</option>
              <option value="CORRECTIVO">Correctivo</option>
              <option value="PREVENTIVO">Preventivo</option>
              <option value="PREDICTIVO">Predictivo</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">
              Responsable <span class="required">*</span>
            </label>
            <select class="form-control"
                    [(ngModel)]="nueva.responsableId"
                    name="responsableId"
                    required>
              <option [ngValue]="null">Seleccionar técnico...</option>
              <option [ngValue]="1">Juan Pérez</option>
              <option [ngValue]="2">María González</option>
              <option [ngValue]="3">Carlos Rodríguez</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Fecha de Inicio</label>
            <input type="date"
                   class="form-control"
                   [(ngModel)]="nueva.fechaInicio"
                   name="fechaInicio">
          </div>

          <div class="form-group full-width">
            <label class="form-label">Ubicación / Dirección</label>
            <input type="text"
                   class="form-control"
                   [(ngModel)]="nueva.direccion"
                   name="direccion"
                   placeholder="Ej: Av. Principal 123, Obra Central">
          </div>

          <div class="form-group full-width">
            <label class="form-label">
              Descripción del Problema <span class="required">*</span>
            </label>
            <textarea rows="3"
                      class="form-control"
                      [(ngModel)]="nueva.descripcion"
                      name="descripcion"
                      required
                      placeholder="Describe detalladamente el problema..."></textarea>
          </div>
        </div>

        <!-- Acciones -->
        <div class="form-actions">
          <button type="button" class="btn-secondary" (click)="volver()">
            <i class="bi bi-x-lg"></i>
            <span>Cancelar</span>
          </button>
          <button type="submit" class="btn-primary">
            <i class="bi bi-save"></i>
            <span>Guardar Reparación</span>
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
