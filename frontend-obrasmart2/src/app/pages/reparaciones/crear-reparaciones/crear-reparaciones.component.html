<div class="layout-container">
  <!-- 🔹 NAVBAR SUPERIOR -->
  <header class="top-navbar">
    <button class="btn-back" routerLink="/listado-usuario" title="Volver al listado">
        <i class="bi bi-arrow-left-circle"></i>
        <span>Volver</span>
      </button>
    <div class="navbar-content">
      <h1 class="navbar-title">Nueva Reparación</h1>
    </div>
  </header>

  <!-- 🔹 CONTENIDO PRINCIPAL -->
  <main class="content">
    <div class="form-card">
      <form (ngSubmit)="guardar()" class="form-body">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">
              Equipo <span class="required">*</span>
            </label>
            <select class="form-control"
                    [(ngModel)]="nueva.equipoId"
                    name="equipoId"
                    required>
              <option [ngValue]="null">Seleccionar equipo...</option>
              <option *ngFor="let eq of equipos" [value]="eq.id">
                {{ eq.nombre }} - {{ eq.numeroSerie }}
              </option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">
              Tipo de Mantenimiento <span class="required">*</span>
            </label>
            <select class="form-control"
                    [(ngModel)]="nueva.tipoMantenimiento"
                    name="tipoMantenimiento"
                    required>
              <option value="">Seleccionar tipo...</option>
              <option value="CORRECTIVO">Correctivo</option>
              <option value="PREVENTIVO">Preventivo</option>
              <option value="PREDICTIVO">Predictivo</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">
              Asignar Responsable <span class="required">*</span>
            </label>
            <select class="form-control"
                    [(ngModel)]="nueva.responsableId"
                    name="responsableId"
                    required>
              <option [ngValue]="null">Seleccionar técnico...</option>
              <option *ngFor="let usuario of usuarios" [ngValue]="usuario.id">
                {{ usuario.username }} ({{ usuario.email }})
              </option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Fecha de Inicio</label>
            <input type="date"
                   class="form-control"
                   [(ngModel)]="nueva.fechaInicio"
                   name="fechaInicio">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Ubicación / Dirección</label>
          <input type="text"
                 class="form-control"
                 [(ngModel)]="nueva.direccion"
                 name="direccion"
                 placeholder="Ej: Av. Principal 123, Obra Central">
        </div>

        <div class="form-group">
          <label class="form-label">
            Descripción del Problema <span class="required">*</span>
          </label>
          <textarea rows="3"
                    class="form-control"
                    [(ngModel)]="nueva.descripcion"
                    name="descripcion"
                    required
                    placeholder="Describe el problema..."></textarea>
        </div>

        <!-- Acciones -->
        <div class="form-actions">
          <button type="button" class="btn-secondary" (click)="volver()">
            <i class="bi bi-x-lg"></i>
            <span>Cancelar</span>
          </button>
          <button type="submit" class="btn-primary">
            <i class="bi bi-save"></i>
            <span>Guardar Reparación</span>
          </button>
        </div>
      </form>
    </div>
  </main>
   <!-- 🔹 FOOTER -->
  <footer class="footer">

    <span class="version">v1.0.0</span>
  </footer>
</div>
