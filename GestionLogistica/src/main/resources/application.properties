server.port=8088
spring.application.name=GestionLogistica

spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_logistica_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.messages.encoding=UTF-8

# Base URL del gateway para autenticacion stateful
auth.base-url=http://localhost:8085

# URLs de los otros microservicios
# IMPORTANTE: Ajustar según tu configuración real
microservices.equipos.url=http://localhost:8087
microservices.obradores.url=http://localhost:8084
microservices.auth.url=http://localhost:8080

# Configuración de RestTemplate (timeouts en milisegundos)
rest.connection.timeout=5000
rest.read.timeout=5000

# Logging
logging.level.com.ObraSmart.GestionLogistica=DEBUG
logging.level.org.springframework.web.client=DEBUG