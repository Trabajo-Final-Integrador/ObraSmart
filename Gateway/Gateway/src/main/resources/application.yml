server:
  port: 8085

spring:
  application:
    name: gateway

  cloud:
    gateway:
      mvc:
        routes:

          - id: login-service
            uri: http://localhost:8081
            predicates:
              - Path=/auth/**, /users/**
            filters:
              - StripPrefix=0


          - id: stock-service
            uri: http://localhost:8083
            predicates:
              - Path=/api/**


      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
        - PreserveHostHeader
        - AddResponseHeader=Access-Control-Allow-Credentials,true
        - AddResponseHeader=Access-Control-Allow-Origin,http://localhost:4200
        - AddRequestHeader=Cookie, #{request.headers.Cookie}

      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
