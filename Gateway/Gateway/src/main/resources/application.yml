server:
  port: 8085

spring:
  application:
    name: gateway

  cloud:
    gateway:
      mvc:
        default-filters:
          - PreserveHostHeader
          - AddRequestHeader=Cookie, #{request.headers['Cookie']}
        routes:

          - id: login-service
            uri: http://localhost:8081
            predicates:
              - Path=/auth/**, /users/**
            filters:
              - StripPrefix=0


          - id: asistente-service
            uri: http://localhost:8099
            predicates:
              - Path=/api/asistente/**
            filters:
              - StripPrefix=0


          - id: reparaciones-service
            uri: http://localhost:8086
            predicates:
              - Path=/reparaciones/**
            filters:
              - StripPrefix=0




          - id: equipos-service
            uri: http://localhost:8087   # ⚠️ Cambiá este puerto al que uses en GestionEquipos
            predicates:
            - Path=/equipos/**, /marca/**, /modelo/**, /tipo-equipo/**      # Lo que recibe el gateway
            filters:
            - StripPrefix=0

          - id: gestion-geolocalizacion
            uri: http://localhost:8089
            predicates:
            - Path=/api/geolocalizacion/**
            filters:
            - StripPrefix=0

          - id: stock-service
            uri: http://localhost:8083
            predicates:

              - Path=/proveedores/**, /repuestos/**, /ordenes/**, /categorias/**, /movimientos/**
            filters:
              - StripPrefix=0



      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
