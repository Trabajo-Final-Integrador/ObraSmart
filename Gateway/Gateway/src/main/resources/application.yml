server:
  port: 8085

spring:
  application:
    name: gateway
  cloud:
    gateway:
      mvc:
        routes:

          # ---------- AUTH (GestionAuth) ----------
          - id: auth
            uri: http://identity-service:8082
            predicates:
              - Path=/auth/**
            filters:
              - AddRequestHeader=X-Forwarded-Host, localhost
              - AddRequestHeader=X-Forwarded-Proto, http

          # ---------- AUTH (GestionAuth) con prefijo /api ----------
          - id: api-auth
            uri: http://identity-service:8082
            predicates:
              - Path=/api/auth/**
            filters:
              - RewritePath=/api/(?<segment>.*), /${segment}
              - AddRequestHeader=X-Forwarded-Host, localhost
              - AddRequestHeader=X-Forwarded-Proto, http

          # ---------- USERS (GestionUsuario) ----------
          - id: users
            uri: http://identity-service:8082
            predicates:
              - Path=/users/**,/api/users/**
            filters:
              - RewritePath=/api/(?<segment>.*), /${segment}
              - AddRequestHeader=X-Forwarded-Host, localhost
              - AddRequestHeader=X-Forwarded-Proto, http


          # ---------- EQUIPOS ----------
          - id: equipos
            uri: http://gestion-equipos:8087
            predicates:
              - Path=/equipos/**,/marca/**,/modelo/**,/tipo-equipo/**,/api/equipos/**,/api/marca/**,/api/modelo/**,/api/tipo-equipo/**
            filters:
              - RewritePath=/api/(?<segment>.*), /${segment}
              - AddRequestHeader=X-Forwarded-Host, localhost
              - AddRequestHeader=X-Forwarded-Proto, http

          # ---------- LOGISTICA (distancias/traslados) ----------
          - id: logistica
            uri: http://gestion-logistica:8088
            predicates:
              - Path=/distancias/**,/traslados/**,/api/distancias/**,/api/traslados/**
            filters:
              - RewritePath=/api/(?<segment>.*), /${segment}
              - AddRequestHeader=X-Forwarded-Host, localhost
              - AddRequestHeader=X-Forwarded-Proto, http

          # ---------- STOCK ----------
          - id: stock
            uri: http://gestion-stock:8083
            predicates:
              - Path=/proveedores/**,/repuestos/**,/categorias/**,/movimientos/**,/ordenes/**,/api/proveedores/**,/api/repuestos/**,/api/categorias/**,/api/movimientos/**,/api/ordenes/**
            filters:
              - RewritePath=/api/(?<segment>.*), /${segment}
              - AddRequestHeader=X-Forwarded-Host, localhost
              - AddRequestHeader=X-Forwarded-Proto, http

          # ---------- REPARACIONES ----------
          - id: reparaciones
            uri: http://gestion-reparaciones:8086
            predicates:
              - Path=/reparaciones/**,/api/reparaciones/**
            filters:
              - RewritePath=/api/(?<segment>.*), /${segment}
              - AddRequestHeader=X-Forwarded-Host, localhost
              - AddRequestHeader=X-Forwarded-Proto, http

          # ---------- MEDIA (media-service) ----------
          - id: media
            uri: http://media-service:8090
            predicates:
              - Path=/files/**,/api/files/**
            filters:
              - RewritePath=/api/(?<segment>.*), /${segment}
              - AddRequestHeader=X-Forwarded-Host, localhost
              - AddRequestHeader=X-Forwarded-Proto, http
          - id: media-equipos
            uri: http://media-service:8090
            predicates:
              - Path=/media/**
            filters:
              - AddRequestHeader=X-Forwarded-Host, localhost
              - AddRequestHeader=X-Forwarded-Proto, http
          - id: api-media
            uri: http://media-service:8090
            predicates:
              - Path=/api/media/**
            filters:
              - AddRequestHeader=X-Forwarded-Host, localhost
              - AddRequestHeader=X-Forwarded-Proto, http
              - RewritePath=/api(?<segment>/media/.*), /${segment}

          # ---------- GEOLOCALIZACION ----------
          - id: geolocalizacion
            uri: http://gestion-geolocalizacion:8089
            predicates:
              - Path=/geolocalizacion/**,/api/geolocalizacion/**
            filters:
              - RewritePath=/geolocalizacion(?<segment>/?.*), /api/geolocalizacion${segment}

          # ---------- REPORTES ----------
          - id: reportes
            uri: http://gestion-reportes:8077
            predicates:
              - Path=/reportes/**
            filters:
              - AddRequestHeader=X-Forwarded-Host, localhost
              - AddRequestHeader=X-Forwarded-Proto, http

          # ---------- OBRADORES ----------
          - id: obradores
            uri: http://gestion-obrador:8084
            predicates:
              - Path=/obradores/**,/api/obradores/**
            filters:
              - RewritePath=/api/(?<segment>.*), /${segment}
              - AddRequestHeader=X-Forwarded-Host, localhost
              - AddRequestHeader=X-Forwarded-Proto, http

          # ---------- ASISTENTE ----------
          - id: asistente
            uri: http://gestion-asistente:8099
            predicates:
              - Path=/asistente/**,/api/asistente/**
            filters:
              - RewritePath=/asistente(?<segment>/?.*), /api/asistente${segment}

          # ---------- REPORTES (GestionReportes) con prefijo /api ----------
          - id: api-reportes
            uri: http://gestion-reportes:8077
            predicates:
              - Path=/api/reportes/**
            filters:
              - RewritePath=/api/(?<segment>.*), /${segment}
              - AddRequestHeader=X-Forwarded-Host, localhost
              - AddRequestHeader=X-Forwarded-Proto, http

logging:
  level:
    org.springframework.security: INFO
