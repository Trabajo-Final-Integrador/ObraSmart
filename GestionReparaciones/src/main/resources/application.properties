# Puerto del microservicio
server.port=8086

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_reparacionesdb
spring.datasource.username=postgres
spring.datasource.password=123456

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# URL del servicio gestion-equipos (ajustá si corresponde)
clients.gestion-equipos.url=http://localhost:8081

# LocationIQ key (si usás). Si está vacío, se usará Nominatim.
locationiq.key=
