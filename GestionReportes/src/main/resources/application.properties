server.port=8077
spring.application.name=GestionReportes

# UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.messages.encoding=UTF-8

spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_reportesdb
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

obrasmart.equipos.base-url=http://localhost:8085/equipos
obrasmart.reparaciones.base-url=http://localhost:8085/reparaciones
obrasmart.stock.repuestos-url=http://localhost:8085/repuestos
obrasmart.stock.movimientos-url=http://localhost:8085/movimientos
