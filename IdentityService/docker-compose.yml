version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-01-11T07-21-30Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  create-bucket:
    image: minio/mc:RELEASE.2025-01-11T07-21-30Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/identity || true
      "

  identity-service:
    build: .
    depends_on:
      - postgres
      - minio
      - create-bucket
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: identity
      DB_USER: postgres
      DB_PASS: postgres
      JWT_SECRET: dev-secret-change
      JWT_ACCESS_TTL_MIN: 15
      JWT_REFRESH_TTL_H: 168
      COOKIES_SECURE: false
      COOKIES_SAMESITE: Lax
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: identity
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@local
      ADMIN_PASSWORD: admin123
    ports:
      - "8082:8082"

volumes:
  pgdata:
  minio-data:
