<div class="dashboard">

  <header class="navbar">
    <button class="menu-btn" (click)="toggleMenu()">☰</button>
    <h1 class="navbar-title">ObraSmart Gestión</h1>
  </header>

  <aside class="sidebar" [class.open]="menuAbierto">
    <ul class="nav flex-column">

      <!-- Usuarios -->
      <li class="nav-item">
        <a class="nav-link d-flex justify-content-between align-items-center"
           href="#" (click)="toggleUsuarios($event)">
          Usuarios
          <span [class.rotate]="submenuUsuariosOpen">▼</span>
        </a>

        <ul *ngIf="submenuUsuariosOpen" class="submenu">
          <li><a class="dropdown-item" routerLink="/alta-usuario">Registrar Usuario</a></li>
          <li><a class="dropdown-item" routerLink="/listado-usuario">Listado de Usuarios</a></li>
        </ul>
      </li>

      <!-- Otras opciones -->
      <li class="nav-item"><a class="nav-link" routerLink="/reparaciones">Reparaciones</a></li>
      <li class="nav-item"><a class="nav-link" routerLink="/mantenimientos">Mantenimientos</a></li>

      <li class="nav-item">
        <a class="nav-link" routerLink="/equipos" routerLinkActive="active">Equipos</a>
      </li>

      <!-- Stock -->
      <li class="nav-item">
        <a class="nav-link d-flex justify-content-between align-items-center"
           href="#"
           (click)="toggleStock($event)">
          Stock
          <span [class.rotate]="submenuStockOpen">▼</span>
        </a>

        <ul *ngIf="submenuStockOpen" class="submenu">
          <li><a class="dropdown-item" routerLink="/stock/repuestos" routerLinkActive="active">Repuestos</a></li>
          <li><a class="dropdown-item" routerLink="/stock/proveedores" routerLinkActive="active">Proveedores</a></li>
          <li><a class="dropdown-item" routerLink="/stock/movimientos" routerLinkActive="active">Movimientos</a></li>
          <li><a class="dropdown-item" routerLink="/stock/ordenes" routerLinkActive="active">Órdenes</a></li>
        </ul>
      </li>

      <li class="nav-item"><a class="nav-link" routerLink="/reportes">Reportes</a></li>
      <li class="nav-item"><a class="nav-link" routerLink="/asistente">Asistente</a></li>

    </ul>
  </aside>

  <div id="map"></div>

  <!-- 🔵 ASISTENTE GLOBAL (burbuja + chat) -->
  <app-chat-asistente></app-chat-asistente>

</div>
