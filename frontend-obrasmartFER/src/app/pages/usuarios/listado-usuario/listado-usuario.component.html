<div class="layout-container">
  <!-- 🔹 NAVBAR SUPERIOR -->
  <header class="top-navbar">
    <button class="menu-btn" (click)="toggleSidebar()" title="Menú principal">
      <i class="bi bi-list"></i>
    </button>
    <h1 class="navbar-title">Gestión de Usuarios</h1>
    <app-helper tooltip="Administre usuarios activos e inactivos."></app-helper>
  </header>

  <!-- 🔹 CONTENIDO PRINCIPAL -->
  <main class="content">
    <!-- 🔸 Tabla -->
    <div class="table-container">
      <div class="toolbar">
        <div class="search-container">
          <i class="bi bi-search"></i>
          <input
            type="text"
            [(ngModel)]="filtro"
            placeholder="Buscar por usuario, email o rol"
          />
          <button class="filter-btn" title="Filtrar">
            <i class="bi bi-funnel"></i>
          </button>
        </div>
      </div>

      <table class="styled-table">
        <thead>
          <tr>
            <th>Email</th>
            <th>Usuario</th>
            <th>Rol</th>
            <th>Estado</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of usuariosPaginados">
            <td>{{ u.email }}</td>
            <td>{{ u.username }}</td>
            <td>{{ u.role }}</td>
            <td>
              <span
                class="badge"
                [ngClass]="
                  u.status === 'ACTIVO' ? 'badge-success' : 'badge-danger'
                "
              >
                {{ u.status }}
              </span>
            </td>
            <td class="acciones">
              <button class="btn-icon edit" (click)="editar(u)" title="Editar">
                <i class="bi bi-pencil"></i>
              </button>
              <button
                class="btn-icon delete"
                (click)="eliminar(u.id)"
                title="Eliminar"
              >
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <div *ngIf="usuarios.length === 0" class="empty-message">
        <i class="bi bi-exclamation-circle"></i>
        <p>No hay usuarios registrados.</p>
      </div>
      <!-- 🔸 Paginación -->
      <!-- 🔸 Paginador con estilo DataTable -->
      <div class="pagination-container">
        <button (click)="primeraPagina()" [disabled]="paginaActual === 1">
          &laquo;
        </button>
        <button (click)="paginaAnterior()" [disabled]="paginaActual === 1">
          &lsaquo;
        </button>

        <span>Página {{ paginaActual }} de {{ totalPaginas }}</span>

        <button
          (click)="paginaSiguiente()"
          [disabled]="paginaActual === totalPaginas"
        >
          &rsaquo;
        </button>
        <button
          (click)="ultimaPagina()"
          [disabled]="paginaActual === totalPaginas"
        >
          &raquo;
        </button>

        <select [(ngModel)]="usuariosPorPagina" (change)="paginaActual = 1">
          <option *ngFor="let n of [5, 10, 20, 50]" [value]="n">{{ n }}</option>
        </select>
      </div>
    </div>
  </main>

  <!-- 🔹 FOOTER -->
  <footer class="footer">
    <span>Términos</span> | <span>Privacidad</span> | <span>Soporte</span>
    <span class="version">v1.0.0</span>
  </footer>
</div>

 <!-- 🔹 MODAL (al final del archivo) -->
<div class="modal-backdrop" *ngIf="mostrarModal" (click)="cerrarModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <h3>Editar Usuario</h3>

    <label for="modal-email">Email</label>
    <input 
      id="modal-email"
      [(ngModel)]="usuarioEdit.email" 
      type="email"
      name="email"
    />

    <label for="modal-username">Usuario</label>
    <input 
      id="modal-username"
      [(ngModel)]="usuarioEdit.username" 
      type="text"
      name="username"
    />

    <label for="modal-role">Rol</label>
    <select 
      id="modal-role"
      [(ngModel)]="usuarioEdit.role"
      name="role"
    >
      <option value="ADMINISTRACION">ADMINISTRACIÓN</option>
      <option value="TECNICO">TÉCNICO</option>
      <option value="OPERARIO">OPERARIO</option>
    </select>

    <label for="modal-status">Estado</label>
    <select 
      id="modal-status"
      [(ngModel)]="usuarioEdit.status"
      name="status"
    >
      <option value="ACTIVO">ACTIVO</option>
      <option value="INACTIVO">INACTIVO</option>
    </select>

    <div class="modal-actions">
      <button class="btn-cancel" type="button" (click)="cerrarModal()">
        Cancelar
      </button>
      <button class="btn-save" type="button" (click)="guardarCambios()">
        Guardar Cambios
      </button>
    </div>
  </div>
</div>
