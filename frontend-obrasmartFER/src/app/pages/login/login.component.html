
<div class="login-page">


  <div class="overlay"></div>

  <div class="container">
    <!-- Columna izquierda -->
    <div class="welcome-section">
      <h1>Bienvenido al Sistema</h1>
      
    
    </div>

    <!-- Columna derecha -->
    <div class="form-section">
      <h2>Iniciar Sesion</h2>
      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" [(ngModel)]="username" name="username" class="form-control" placeholder="Ingrese su usuario" required />
        <!-- <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div> -->
      </div>

        <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" [(ngModel)]="password" name="password" class="form-control"  placeholder="Ingrese su contraseña" required />
        </div>
        <button type="submit" [disabled]="loading">{{ loading ? 'Ingresando...' : 'Ingresar' }}</button>
        <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
        <div class="text-center mt-3">
        <a routerLink="/auth/reset-password" class="text-decoration">No recuerda su contraseña?</a>
        </div>
        
      </form>
    </div>
  </div>

</div>
