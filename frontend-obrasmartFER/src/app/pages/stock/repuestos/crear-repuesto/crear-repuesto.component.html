<div class="container mt-4">
  <h2 class="mb-3 text-center text-uppercase fw-bold">Registrar nuevo repuesto</h2>

  <!-- Alertas -->
  <div *ngIf="error" class="alert alert-danger text-center">{{ error }}</div>
  <div *ngIf="exito" class="alert alert-success text-center">
    ✅ Repuesto creado correctamente.
  </div>

  <!-- Formulario -->
  <form (ngSubmit)="guardar()" #f="ngForm" class="card p-4 shadow-sm bg-light">
    <div class="row g-3">
      <!-- Nombre -->
      <div class="col-md-6">
        <label class="form-label">Nombre *</label>
        <input
          type="text"
          class="form-control"
          name="nombre"
          [(ngModel)]="modelo.nombre"
          required
        />
      </div>

      <!-- Código Interno -->
      <div class="col-md-6">
        <label class="form-label">Código Interno</label>
        <input
          type="text"
          class="form-control"
          name="codigoInterno"
          [(ngModel)]="modelo.codigoInterno"
        />
      </div>

      <!-- Cantidad -->
      <div class="col-md-4">
        <label class="form-label">Cantidad *</label>
        <input
          type="number"
          class="form-control"
          name="cantidad"
          [(ngModel)]="modelo.cantidad"
          min="0"
          required
        />
      </div>

      <!-- Stock mínimo -->
      <div class="col-md-4">
        <label class="form-label">Stock mínimo</label>
        <input
          type="number"
          class="form-control"
          name="stockMinimo"
          [(ngModel)]="modelo.stockMinimo"
          min="0"
        />
      </div>

      <!-- Precio unitario -->
      <div class="col-md-4">
        <label class="form-label">Precio unitario</label>
        <input
          type="number"
          step="0.01"
          class="form-control"
          name="precioUnitario"
          [(ngModel)]="modelo.precioUnitario"
        />
      </div>

      <!-- Unidad de medida -->
      <div class="col-md-6">
        <label class="form-label">Unidad de medida</label>
        <input
          type="text"
          class="form-control"
          name="unidadMedida"
          [(ngModel)]="modelo.unidadMedida"
        />
      </div>

      <!-- Ubicación -->
      <div class="col-md-6">
        <label class="form-label">Ubicación</label>
        <input
          type="text"
          class="form-control"
          name="ubicacion"
          [(ngModel)]="modelo.ubicacion"
        />
      </div>

      <!-- Categoría -->
      <div class="col-md-6">
        <label class="form-label">Categoría</label>
        <select
          class="form-select"
          name="categoriaId"
          [(ngModel)]="modelo.categoriaId"
        >
          <option [ngValue]="null" disabled selected>Seleccione...</option>
          <!-- 🔹 Llenar dinámicamente cuando tengas el servicio de categorías -->
        </select>
      </div>

      <!-- Proveedor -->
      <div class="col-md-6">
        <label class="form-label">Proveedor</label>
        <select
          class="form-select"
          name="proveedorId"
          [(ngModel)]="modelo.proveedorId"
        >
          <option [ngValue]="null" disabled selected>Seleccione...</option>
          <!-- 🔹 Llenar dinámicamente cuando tengas el servicio de proveedores -->
        </select>
      </div>

      <!-- Estado -->
      <div class="col-md-6">
        <label class="form-label">Estado</label>
        <select
          class="form-select"
          [(ngModel)]="modelo.estado"
          name="estado"
        >
          <option [ngValue]="true">Activo</option>
          <option [ngValue]="false">Inactivo</option>
        </select>
      </div>
    </div>

    <!-- Botones -->
    <div class="d-flex justify-content-end mt-4 gap-2">
      <button
        class="btn btn-success"
        type="submit"
        [disabled]="f.invalid || cargando"
      >
        <i class="bi bi-check-circle"></i> Guardar
      </button>
      <button class="btn btn-secondary" type="button" (click)="cancelar()">
        <i class="bi bi-x-circle"></i> Cancelar
      </button>
    </div>

    <!-- Cargando -->
    <div *ngIf="cargando" class="text-center mt-3">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Guardando...</span>
      </div>
    </div>
  </form>
</div>
