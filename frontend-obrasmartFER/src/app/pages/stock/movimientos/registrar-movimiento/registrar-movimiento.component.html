<div class="container mt-4">
  <h2 class="text-center text-uppercase mb-3">Registrar Movimiento de Stock</h2>

  <form (ngSubmit)="registrar()" #f="ngForm" class="card p-4 shadow-sm bg-light">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Repuesto *</label>
        <select class="form-select" name="repuestoId" [(ngModel)]="modelo.repuestoId" required>
          <option [ngValue]="0" disabled selected>Seleccione...</option>
          <option *ngFor="let r of repuestos" [value]="r.id">{{ r.nombre }}</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">Tipo</label>
        <select class="form-select" name="tipo" [(ngModel)]="modelo.tipo">
          <option>ENTRADA</option>
          <option>SALIDA</option>
          <option>AJUSTE</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">Cantidad *</label>
        <input type="number" class="form-control" name="cantidad" [(ngModel)]="modelo.cantidad" required min="1" />
      </div>

      <div class="col-12">
        <label class="form-label">Motivo *</label>
        <input type="text" class="form-control" name="motivo" [(ngModel)]="modelo.motivo" required />
      </div>
    </div>

    <div class="d-flex justify-content-end mt-4 gap-2">
      <button class="btn btn-success" type="submit" [disabled]="f.invalid || cargando">
        <i class="bi bi-check-circle"></i> Registrar
      </button>
      <button class="btn btn-secondary" type="reset">
        <i class="bi bi-x-circle"></i> Limpiar
      </button>
    </div>
  </form>

  <div *ngIf="exito" class="alert alert-success text-center mt-3">
    ✅ Movimiento registrado correctamente.
  </div>

  <div *ngIf="error" class="alert alert-danger text-center mt-3">{{ error }}</div>
</div>
