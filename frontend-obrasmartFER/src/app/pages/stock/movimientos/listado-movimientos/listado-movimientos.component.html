
<div class="container mt-4">
  <h2 class="text-center text-uppercase mb-3">Historial de Movimientos</h2>

  <table *ngIf="movimientos.length" class="table table-striped text-center shadow-sm">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Tipo</th>
        <th>Cantidad</th>
        <th>Motivo</th>
        <th>Usuario</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of movimientos">
        <td>{{ m.id }}</td>
        <td>{{ m.tipo }}</td>
        <td>{{ m.cantidad }}</td>
        <td>{{ m.motivo }}</td>
        <td>{{ m.usuario }}</td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!movimientos.length" class="alert alert-warning text-center">
    No hay movimientos registrados para este repuesto.
  </div>
</div>
