<!-- CONTACTO -->
<div *ngIf="tabActiva === 'contacto'" class="contacto-container">
  <div class="row g-3">
    <div class="col-md-6">
      <label>Teléfono Principal <span class="required">*</span></label>
      <input
        type="tel"
        [(ngModel)]="nuevoProveedor.telefono"
        class="form-input"
        required
      />
    </div>

    <div class="col-md-6">
      <label>Email <span class="required">*</span></label>
      <input
        type="email"
        [(ngModel)]="nuevoProveedor.email"
        class="form-input"
        required
      />
    </div>

    <div class="col-span-2">
      <label>Horario de Atención</label>
      <input
        type="text"
        [(ngModel)]="nuevoProveedor.horarioAtencion"
        placeholder="Ej: Lunes a Viernes 8:00 a 18:00"
        class="form-input"
      />
    </div>

    <div class="col-span-2">
      <label>Dirección <span class="required">*</span></label>
      <input
        type="text"
        [(ngModel)]="nuevoProveedor.direccion"
        class="form-input"
        required
      />
    </div>

    <div class="col-md-6">
      <label>Ciudad <span class="required">*</span></label>
      <input
        type="text"
        [(ngModel)]="nuevoProveedor.ciudad"
        class="form-input"
        required
      />
    </div>

    <div class="col-md-6">
      <label>Provincia <span class="required">*</span></label>
      <select
        [(ngModel)]="nuevoProveedor.provincia"
        class="form-input"
        required
      >
        <option value="">Seleccionar...</option>
        <option *ngFor="let prov of provinciasArgentinas" [value]="prov">
          {{ prov }}
        </option>
      </select>
    </div>

    <div class="col-md-6">
      <label>Código Postal</label>
      <input
        type="text"
        [(ngModel)]="nuevoProveedor.codigoPostal"
        class="form-input"
      />
    </div>
  </div>
  <div class="col-span-2 text-end mt-4">
    <button class="btn-anterior" (click)="volver()">← Anterior</button>
    <button class="btn-siguiente" (click)="continuar()">Siguiente →</button>
  </div>
</div>
