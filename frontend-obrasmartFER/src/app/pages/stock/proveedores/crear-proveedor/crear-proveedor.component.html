
<div class="proveedor-container">
    
   <div class="header">
    <h2>{{ vista === "nuevo" ? "Nuevo Proveedor" : "Editar Proveedor" }}</h2>
    <button class="close-btn">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button
      *ngFor="let tab of tabs"
      (click)="setTabActiva(tab.id)"
      [ngClass]="{ active: tabActiva === tab.id }"
      class="tab-btn"
    >
      <i [class]="tab.icon"></i> {{ tab.label }}
    </button>
  </div>

  <!-- Formulario -->
  <div class="tab-content">
    <!-- GENERAL -->
    <div *ngIf="tabActiva === 'general'" class="grid grid-cols-2 gap-4">
      <div class="row g-3">
        <div class="col-md-6">
          <label>Razón Social <span class="required">*</span></label>
          <input
            type="text"
            [(ngModel)]="nuevoProveedor.razonSocial"
            class="form-input"
            required
          />
        </div>

        <div class="col-md-6">
          <label>Nombre Comercial</label>
          <input
            type="text"
            [(ngModel)]="nuevoProveedor.nombreComercial"
            class="form-input"
          />
        </div>

        <div class="col-md-6">
          <label class="label2">CUIT <span class="required">*</span></label>
          <input
            type="text"
            [(ngModel)]="nuevoProveedor.cuit"
            placeholder="XX-XXXXXXXX-X"
            class="form-input"
            required
          />
        </div>

        <div class="col-md-6">
          <label>Condición IVA <span class="required">*</span></label>
          <select
            [(ngModel)]="nuevoProveedor.condicionIVA"
            class="form-input"
            required
          >
            <option value="">Seleccionar...</option>
            <option value="Responsable Inscripto">Responsable Inscripto</option>
            <option value="Monotributista">Monotributista</option>
            <option value="Exento">Exento</option>
          </select>
        </div>

        <div class="col-span-2">
          <label>Estado</label>
          <div class="estado">
            <label>
              <input
                type="radio"
                value="Activo"
                [(ngModel)]="nuevoProveedor.estado"
              />
              <span>Activo</span>
            </label>
            <label>
              <input
                type="radio"
                value="Inactivo"
                [(ngModel)]="nuevoProveedor.estado"
              />
              <span>Inactivo</span>
            </label>
          </div>
        </div>
      </div>
      <div class="col-span-2 text-end mt-4">
    
    <!-- <button class="btn-siguiente" (click)="continuar()">Siguiente →</button> -->
  </div>
    </div>
    <!-- CONTACTO -->
<app-step-contacto
  *ngIf="tabActiva === 'contacto'"
  [tabActiva]="tabActiva"
  [nuevoProveedor]="nuevoProveedor"
  (next)="irAlSiguiente('bancarios')"
  (prev)="irAlAnterior('general')">
</app-step-contacto>
<!-- BANCARIOS -->
<app-step-bancarios
  *ngIf="tabActiva === 'bancario'"
  [tabActiva]="tabActiva"
  [nuevoProveedor]="nuevoProveedor"
  (next)="irAlSiguiente('confirmar')"
  (prev)="irAlAnterior('contacto')">
</app-step-bancarios>
<app-step-catalogo
  *ngIf="tabActiva === 'catalogo'"
  [tabActiva]="tabActiva"
  [nuevoProveedor]="nuevoProveedor"
  (next)="irAlSiguiente('confirmar')"
  (prev)="irAlAnterior('bancario')">
</app-step-catalogo>
<app-step-comercio
  *ngIf="tabActiva === 'comercial'"
  [tabActiva]="tabActiva"
  [nuevoProveedor]="nuevoProveedor"
  (next)="irAlSiguiente('bancario')"
  (prev)="irAlAnterior('general')">
</app-step-comercio>


<!-- CONFIRMAR -->
<app-step-confirmar
  *ngIf="tabActiva === 'confirmar'"
  [tabActiva]="tabActiva"
  [nuevoProveedor]="nuevoProveedor"
  (prev)="irAlAnterior('bancarios')">
</app-step-confirmar>
