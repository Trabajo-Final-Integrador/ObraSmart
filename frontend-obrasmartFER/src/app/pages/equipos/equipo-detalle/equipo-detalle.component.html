<div class="modal-backdrop fade show"></div>
<div class="modal d-block" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">{{ equipo?.nombre }}</h5>
        <button class="btn-close btn-close-white" (click)="cerrarModal()"></button>
      </div>
      <div class="modal-body">
        <p><b>Número de Serie:</b> {{ equipo?.numeroSerie }}</p>
        <p><b>Ubicación:</b> {{ equipo?.ubicacionActual }}</p>
        <p><b>Potencia:</b> {{ equipo?.potenciaHp }} HP</p>
      </div>
    </div>
  </div>
</div>
