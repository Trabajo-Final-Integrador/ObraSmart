<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Listado de Marcas</h3>
  <button class="btn btn-primary" routerLink="/equipos/marcas/crear">
    <i class="bi bi-plus"></i> Agregar Marca
  </button>
</div>
<div class="tabla-container">
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of marcas">
        <td>{{ m.id }}</td>
        <td>{{ m.nombre }}</td>
        <td>
          <button class="btn btn-sm btn-danger" (click)="eliminar(m.id!)">
            🗑️
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
