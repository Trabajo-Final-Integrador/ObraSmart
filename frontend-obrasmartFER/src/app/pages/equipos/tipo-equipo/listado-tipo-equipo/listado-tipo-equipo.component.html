<div class="container mt-4">
  <h3 class="mb-3">⚙️ Tipos de Equipo</h3>

  <div *ngIf="loading" class="text-center">
    <p>Cargando tipos de equipo...</p>
  </div>

  <table *ngIf="!loading" class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of tipos">
        <td>{{ t.id }}</td>
        <td>{{ t.nombre }}</td>
        <td>{{ t.descripcion }}</td>
      </tr>
    </tbody>
  </table>

  <button routerLink="/equipos/tipo-equipo/crear" class="btn btn-primary mt-3">➕ Nuevo Tipo de Equipo</button>
</div>
